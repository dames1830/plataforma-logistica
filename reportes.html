<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  alert('ERROR: ' + msg + '\nLine: ' + lineNo + '\nCol: ' + columnNo);
  document.body.innerHTML += '<div style="position:fixed;top:0;left:0;background:red;color:white;z-index:9999;padding:20px;font-size:20px;width:100%;">ERROR: ' + msg + ' <br> Line: ' + lineNo + '</div>';
  return false;
};
window.addEventListener('unhandledrejection', function(event) {
  alert('PROMISE ERROR: ' + event.reason);
  document.body.innerHTML += '<div style="position:fixed;top:100px;left:0;background:orange;color:white;z-index:9999;padding:20px;font-size:20px;width:100%;">PROMISE ERROR: ' + event.reason + '</div>';
});
</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes | LOGÍSTICA DEAM1830</title>
  <meta name="description" content="Portal de reportes dinámicos de logística DEAM1830 — acceso por enlace seguro." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --surface2: #F4F1EC;
      --border: #DDD8CF;
      --primary: #1C2B3A;
      --accent: #B45309;
      --text: #1C2B3A;
      --text-muted: #9C9590;
      --text-body: #4A4540;
      --font: 'Inter', sans-serif;
      --font-brand: 'Outfit', sans-serif;
      --green: #1A6336;
      --amber: #B45309;
      --red: #991B1B;
      --success: #1A6336;
      --warning: #B45309;
      --danger: #991B1B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    .topbar {
      background: var(--primary);
      border-bottom: none;
      padding: 0 1.5rem;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-brand { display: flex; align-items: center; gap: 0; }
    .topbar-brand h2 {
      font-family: var(--font-brand);
      font-weight: 700;
      color: #fff;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }
    .topbar-badge {
      background: transparent;
      border: 1.5px solid rgba(180,83,9,0.6);
      color: var(--accent);
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      margin-left: 10px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .group-badge {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.75);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 3px;
      letter-spacing: 1px;
    }
    .version-tag { color: rgba(255,255,255,0.35); font-size: 0.68rem; }

    .tab-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.65rem 1rem;
      background: none;
      border: none;
      color: #6B6560;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); font-weight: 700; }

    .subtab-nav {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.5rem;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      padding: 4px 12px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: #6B6560;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .subtab-btn:hover { color: var(--primary); }
    .subtab-btn.active { color: var(--primary); border-bottom-color: var(--accent); font-weight: 700; }

    .content-area { padding: 1.5rem; background: var(--bg); }

    .access-denied {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; gap: 1.5rem; padding: 2rem; background: var(--bg);
    }
    .access-denied .icon { font-size: 4rem; }
    .access-denied h1 { font-family: var(--font-brand); font-size: 1.8rem; color: var(--red); font-weight: 900; }
    .access-denied p { color: var(--text-muted); font-size: 1rem; max-width: 400px; line-height: 1.6; }
    .access-denied .contact {
      background: rgba(153,27,27,0.06); border: 1px solid rgba(153,27,27,0.2);
      border-radius: 8px; padding: 1rem 2rem; color: var(--red); font-weight: 700; font-size: 0.85rem;
    }

    .loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 1rem; background: var(--bg);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(28,43,58,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .report-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0;
    }
    .report-title {
      color: #fff;
      background: var(--primary);
      font-family: var(--font-brand);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-left: 3px solid var(--accent);
      padding: 0.6rem 1rem;
      margin-bottom: 0;
    }

    table.rpt { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.rpt thead tr { background: var(--primary); color: #fff; text-transform: uppercase; font-size: 0.67rem; font-weight: 700; letter-spacing: 0.04em; }
    table.rpt thead th { padding: 7px 10px; }
    table.rpt tbody tr { border-bottom: 1px solid #EEE9E3; }
    table.rpt tbody tr:nth-child(even) { background: #FAFAF8; }
    table.rpt tbody tr:hover { background: var(--surface2); }
    table.rpt tbody td { padding: 6px 10px; color: var(--text-body); }

    .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 1.2rem; align-items: start; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .empty-msg { padding: 3rem; text-align: center; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .kpi-card { padding: 1rem 1.25rem; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .kpi-card:last-child { border-right: none; }
    .kpi-title { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    .kpi-value { font-size: 1.75rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
    .kpi-subtitle { font-size: 0.7rem; color: var(--green); margin-top: 0.25rem; }

    .data-table-container { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid #EEE9E3; }
    .data-table th { font-weight: 700; color: #fff; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--primary); position: sticky; top: -1px; z-index: 10; }
    .data-table td { color: var(--text-body); }
    .data-table tbody tr:nth-child(even) { background: #FAFAF8; }

    .status-badge { padding: 0.2rem 0.6rem; border-radius: 3px; font-size: 0.7rem; font-weight: 700; }
    .status-pending { background: rgba(180,83,9,0.1); color: #92400E; }
    .status-completed { background: rgba(26,99,54,0.1); color: #1A6336; }
    .status-issue { background: rgba(153,27,27,0.1); color: #991B1B; }

    .btn { background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.25rem; border-radius: 5px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #263D52; }

    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 300px; }
    .chart-container canvas { max-width: 100%; max-height: 300px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    @media (max-width: 768px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
