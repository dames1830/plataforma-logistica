<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  alert('ERROR: ' + msg + '\nLine: ' + lineNo + '\nCol: ' + columnNo);

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes | LOGÍSTICA DEAM1830</title>
  <meta name="description" content="Portal de reportes dinámicos de logística DEAM1830 — acceso por enlace seguro." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #0f172a;
      --surface2: #1e293b;
      --border: rgba(255,255,255,0.08);
      --primary: #818cf8;
      --accent: #00E5FF;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --font: 'Inter', sans-serif;
      --font-brand: 'Outfit', sans-serif;
      --green: #22c55e;
      --amber: #fbbf24;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }
    /* ── Topbar ── */
    .topbar {
      background: linear-gradient(90deg, #0a0f1e 0%, #111827 100%);
      border-bottom: 1px solid rgba(0,229,255,0.2);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; }
    .topbar-brand h2 {
      font-family: var(--font-brand);
      font-weight: 700;
      color: #fff;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-badge {
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.3);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .group-badge {
      background: rgba(129,140,248,0.15);
      border: 1px solid rgba(129,140,248,0.4);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .version-tag { color: var(--text-muted); font-size: 0.7rem; }
    /* ── Tab Nav ── */
    .tab-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    /* ── Sub tab nav ── */
    .subtab-nav {
      background: rgba(0,229,255,0.03);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.5rem;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      padding: 5px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .subtab-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .subtab-btn.active {
      background: rgba(0,229,255,0.12);
      border-color: rgba(0,229,255,0.5);
      color: var(--accent);
    }
    /* ── Content ── */
    .content-area {
      padding: 1.5rem;
      min-height: calc(100vh - 120px);
    }
    /* ── Access Denied Screen ── */
    .access-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 1.5rem;
      padding: 2rem;
    }
    .access-denied .icon { font-size: 4rem; }
    .access-denied h1 {
      font-family: var(--font-brand);
      font-size: 1.8rem;
      color: var(--red);
      font-weight: 900;
    }
    .access-denied p { color: var(--text-muted); font-size: 1rem; max-width: 400px; line-height: 1.6; }
    .access-denied .contact {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 1rem 2rem;
      color: var(--red);
      font-weight: 700;
      font-size: 0.85rem;
    }
    /* ── Loading ── */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(0,229,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ── Report cards ── */
    .report-card {
      background: #000;
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      box-shadow: 0 0 25px rgba(0,229,255,0.15);
    }
    .report-title {
      color: var(--accent);
      font-family: var(--font-brand);
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      margin-bottom: 0.8rem;
    }
    table.rpt { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.rpt thead tr {
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 800;
      border-bottom: 2px solid var(--accent);
    }
    table.rpt thead th { padding: 6px 8px; }
    table.rpt tbody tr { border-bottom: 1px solid rgba(0,229,255,0.07); }
    table.rpt tbody tr:hover { background: rgba(0,229,255,0.03); }
    table.rpt tbody td { padding: 5px 8px; }
    /* ── Date filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 1.5rem;
      background: rgba(0,229,255,0.03);
      border-bottom: 1px solid var(--border);
    }
    .filter-bar label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
    .filter-bar input[type=date], .filter-bar select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
    }
    .filter-bar input[type=date]:focus, .filter-bar select:focus {
      border-color: var(--accent);
    }
    .btn-filter {
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.4);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-filter:hover { background: rgba(0,229,255,0.22); }
    /* ── Grid helpers ── */
    .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 1.2rem; align-items: start; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .empty-msg {
      padding: 3rem;
      text-align: center;
      color: rgba(0,229,255,0.3);
      font-weight: 700;
    }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
