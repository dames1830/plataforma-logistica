  <!-- El iconito de la pestaña. En SVG porque escala solo: nitido en los 16px de la
       pestaña y en los 180 de un acceso directo del celular. Declararlo evita, ademas,
       el 404 de /favicon.ico que el navegador pedia por su cuenta. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

<script>
window.addEventListener('error', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:20px;">' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
});
window.addEventListener('unhandledrejection', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:50px;left:0;z-index:9999;background:orange;color:white;padding:20px;font-size:20px;">' + e.reason + '</div>';
});
</script>

  <style>
    #sync-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      pointer-events: auto !important;
    }
    #sync-indicator:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(0,0,0,0.5);
    }
    #sync-indicator .sync-tooltip {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.98) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      text-align: right;
    }
    #sync-indicator:hover .sync-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .sync-online { 
      background: rgba(34, 197, 94, 0.9); 
      border: 1.5px solid rgba(34, 197, 94, 0.5); 
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); 
    }
    .sync-offline { 
      background: rgba(239, 68, 68, 0.9); 
      border: 1.5px solid rgba(239, 68, 68, 0.5); 
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); 
    }
    .sync-working { 
      background: rgba(234, 179, 8, 0.9); 
      border: 1.5px solid rgba(234, 179, 8, 0.5); 
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); 
      animation: pulse-working 1.5s infinite alternate; 
    }
    @keyframes pulse-working {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      #sync-indicator {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="sync-indicator" class="sync-online">
    <span id="sync-icon" style="font-size: 1.1rem; user-select: none;">…</span>
    <div class="sync-tooltip">
      <div id="sync-text" style="font-weight: 800; font-size: 0.75rem; color: #fff; white-space: nowrap;">SISTEMA v29.0314 ONLINE</div>
      <div style="font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 4px; white-space: nowrap;">System is currently up to date and syncing.</div>
    </div>
  </div>

</body>
