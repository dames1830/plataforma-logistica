  <!-- El iconito de la pestaña. En SVG porque escala solo: nitido en los 16px de la
       pestaña y en los 180 de un acceso directo del celular. Declararlo evita, ademas,
       el 404 de /favicon.ico que el navegador pedia por su cuenta. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

<script>
/* AVISO DE ERROR — NO USAR innerHTML AQUI.
 *
 * Lo que habia antes hacia `document.body.innerHTML += ...` para mostrar el error.
 * Esa linea vuelve a armar el cuerpo ENTERO de la pagina: los elementos que estaban
 * se destruyen y se crean otros iguales pero nuevos. La plataforma se queda apuntando
 * a los viejos, que ya no estan en la pantalla, y todo lo que dibuja despues va a la
 * nada: pantalla negra. Peor todavia, al no existir mas `contentArea`, el siguiente
 * dibujo daba "Cannot set properties of null" y volvia a entrar aca, en circulo.
 *
 * 27-ago-2026: eso tumbo produccion. Cualquier error chico apagaba la plataforma entera.
 *
 * Ahora el aviso se AGREGA con appendChild, que no toca nada de lo que ya hay, sale
 * abajo, se puede cerrar, y el detalle completo queda en la consola (F12) para poder
 * rastrear de donde salio. */
(function () {
  var puesto = 0;
  function avisar(texto, detalle) {
    try {
      console.error('[ERROR EN LA PLATAFORMA]', detalle || texto);
      if (puesto >= 3) return;               // no se tapa la pantalla de avisos
      puesto++;
      var b = document.createElement('div');
      b.style.cssText = 'position:fixed; left:12px; bottom:' + (12 + (puesto - 1) * 52) + 'px;'
        + ' z-index:2147483001; max-width:min(560px, calc(100vw - 24px)); background:#7A2E12;'
        + ' color:#fff; padding:9px 34px 9px 12px; border-radius:8px; font:13px/1.45 system-ui, sans-serif;'
        + ' box-shadow:0 6px 22px rgba(0,0,0,.45); white-space:pre-wrap; word-break:break-word;';
      b.textContent = texto;
      var x = document.createElement('button');
      x.textContent = '✕';
      x.setAttribute('aria-label', 'Cerrar el aviso');
      x.style.cssText = 'position:absolute; top:5px; right:7px; background:none; border:none;'
        + ' color:#fff; font-size:14px; line-height:1; cursor:pointer; opacity:.75;';
      x.onclick = function () { b.remove(); };
      b.appendChild(x);
      (document.body || document.documentElement).appendChild(b);
    } catch (_) { /* si ni esto se puede, que no se lleve la pagina por delante */ }
  }
  window.addEventListener('error', function (e) {
    avisar('Fallo algo en la pantalla: ' + e.message, (e.error && e.error.stack) || (e.filename + ':' + e.lineno));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    avisar('Fallo algo en la pantalla: ' + ((r && r.message) || r), (r && r.stack) || r);
  });
})();
</script>
  <!-- TEMA: se aplica antes de que se dibuje el primer pixel.
       Si esto corriera despues, la pantalla arrancaria en indigo y saltaria al
       tema elegido a la vista del usuario. Por eso va aca, en linea y sin
       esperar a ningun modulo: lee la preferencia y la escribe en el <html>.
       El servicio de verdad es js/services_v245/temaService.js; esto es solo
       el adelanto, y usa las mismas claves. -->
  <script>
  (function () {
    try {
      var TEMAS = ['indigo', 'pbi', 'pbi-classic', 'negro'];
      var usuario = null;
      var ses = localStorage.getItem('logistics_session');
      if (ses) { var u = JSON.parse(ses); if (u && u.username) usuario = u.username; }
      // El de esta persona; si no hay -tipico en el login, que corre ANTES de
      // que nadie entre-, el ultimo que se uso en esta computadora.
      //
      // SIN USUARIO NO SE PREGUNTA POR 'deam_tema_anon'. Esa clave no es de nadie, y
      // leerla hacia que una eleccion vieja guardada sin dueno le ganara al tema de
      // verdad: el login salia negro con la plataforma en Power BI. Es la misma regla
      // que aplica getTema() en temaService.js -y hay que cambiarla en LOS DOS, porque
      // este adelanto es una copia a mano del servicio.
      var t = usuario ? localStorage.getItem('deam_tema_' + usuario) : null;
      if (TEMAS.indexOf(t) < 0) t = localStorage.getItem('deam_tema_ultimo');
      document.documentElement.setAttribute('data-tema', TEMAS.indexOf(t) >= 0 ? t : 'indigo');
    } catch (e) {
      document.documentElement.setAttribute('data-tema', 'indigo');
    }
  })();
  </script>

  <style>
    #sync-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(var(--shadow-rgb), 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      pointer-events: auto !important;
    }
    #sync-indicator:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(var(--shadow-rgb), 0.5);
    }
    #sync-indicator .sync-tooltip {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: linear-gradient(135deg, rgba(var(--card-rgb), 0.98) 0%, rgba(var(--bg-rgb), 0.98) 100%);
      border: 1px solid rgba(var(--ink-rgb), 0.08);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(var(--shadow-rgb), 0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      text-align: right;
    }
    #sync-indicator:hover .sync-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .sync-online { 
      background: rgba(var(--success-rgb), 0.9); 
      border: 1.5px solid rgba(var(--success-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--success-rgb), 0.4); 
    }
    .sync-offline { 
      background: rgba(var(--danger-rgb), 0.9); 
      border: 1.5px solid rgba(var(--danger-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--danger-rgb), 0.4); 
    }
    .sync-working { 
      background: rgba(var(--yellow-rgb), 0.9); 
      border: 1.5px solid rgba(var(--yellow-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--yellow-rgb), 0.4); 
      animation: pulse-working 1.5s infinite alternate; 
    }
    @keyframes pulse-working {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      #sync-indicator {
        display: none !important;
      }
    }
  </style>
</head>
<body>

    </div>
  </div>
