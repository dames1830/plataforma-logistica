<!DOCTYPE html>
<html lang="es">
<head>
  <!-- El iconito de la pestaña. En SVG porque escala solo: nitido en los 16px de la
       pestaña y en los 180 de un acceso directo del celular. Declararlo evita, ademas,
       el 404 de /favicon.ico que el navegador pedia por su cuenta. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

<script>
window.addEventListener('error', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:var(--t-xl);">' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
});
window.addEventListener('unhandledrejection', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:50px;left:0;z-index:9999;background:orange;color:white;padding:20px;font-size:var(--t-xl);">' + e.reason + '</div>';
});
</script>
  <!-- TEMA: se aplica antes de que se dibuje el primer pixel.
       Si esto corriera despues, la pantalla arrancaria en indigo y saltaria al
       tema elegido a la vista del usuario. Por eso va aca, en linea y sin
       esperar a ningun modulo: lee la preferencia y la escribe en el <html>.
       El servicio de verdad es js/services_v245/temaService.js; esto es solo
       el adelanto, y usa las mismas claves. -->
  <script>
  (function () {
    try {
      var TEMAS = ['indigo', 'pbi', 'pbi-classic', 'negro'];
      var usuario = 'anon';
      var ses = localStorage.getItem('logistics_session');
      if (ses) { var u = JSON.parse(ses); if (u && u.username) usuario = u.username; }
      // El de esta persona; si no hay -tipico en el login, que corre ANTES de
      // que nadie entre-, el ultimo que se uso en esta computadora.
      var t = localStorage.getItem('deam_tema_' + usuario);
      if (TEMAS.indexOf(t) < 0) t = localStorage.getItem('deam_tema_ultimo');
      document.documentElement.setAttribute('data-tema', TEMAS.indexOf(t) >= 0 ? t : 'indigo');
    } catch (e) {
      document.documentElement.setAttribute('data-tema', 'indigo');
    }
  })();
  </script>

  <style>
    #sync-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(var(--shadow-rgb), 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      pointer-events: auto !important;
    }
    #sync-indicator:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(var(--shadow-rgb), 0.5);
    }
    #sync-indicator .sync-tooltip {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: linear-gradient(135deg, rgba(var(--card-rgb), 0.98) 0%, rgba(var(--bg-rgb), 0.98) 100%);
      border: 1px solid rgba(var(--ink-rgb), 0.08);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(var(--shadow-rgb), 0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      text-align: right;
    }
    #sync-indicator:hover .sync-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .sync-online { 
      background: rgba(var(--success-rgb), 0.9); 
      border: 1.5px solid rgba(var(--success-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--success-rgb), 0.4); 
    }
    .sync-offline { 
      background: rgba(var(--danger-rgb), 0.9); 
      border: 1.5px solid rgba(var(--danger-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--danger-rgb), 0.4); 
    }
    .sync-working { 
      background: rgba(var(--yellow-rgb), 0.9); 
      border: 1.5px solid rgba(var(--yellow-rgb), 0.5); 
      box-shadow: 0 0 15px rgba(var(--yellow-rgb), 0.4); 
      animation: pulse-working 1.5s infinite alternate; 
    }
    @keyframes pulse-working {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      #sync-indicator {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="sync-indicator" class="sync-online">
    <span id="sync-icon" style="font-size:var(--t-lg); user-select: none;">…</span>
    <div class="sync-tooltip">
      <div id="sync-text" style="font-weight: 800; font-size:var(--t-sm); color: var(--text-strong); white-space: nowrap;">SISTEMA v29.0421 ONLINE</div>
      <div style="font-size:var(--t-xs); color: rgba(var(--ink-rgb), 0.4); margin-top: 4px; white-space: nowrap;">System is currently up to date and syncing.</div>
    </div>
  </div>
  <script src="js/app.js?v=29.0421" type="module">
    document.addEventListener('DOMContentLoaded', () => {
      const syncIndicator = document.getElementById('sync-indicator');
      syncIndicator.addEventListener('click', (e) => {
        console.log('Sync indicator clicked', e);
      });
    });
  </script>
</body>
