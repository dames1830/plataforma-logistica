services:
  - type: web
    name: logistics-backend-wv0x
    env: python
    rootDir: backend
    region: ohio
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: "/data/database.db"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # LOS AVISOS DEL CHAT AL CELULAR. El VALOR se pone A MANO en el panel de
      # Render (Environment > Add Environment Variable): la llave privada es una
      # contrasena y nunca entra al repositorio. `sync: false` es justamente eso:
      # la variable queda declarada, el valor lo guarda Render.
      # Es la misma llave que usa el robot del Contabo. Ver backend/avisos_chat.py.
      - key: VAPID_PRIVADA
        sync: false
      - key: VAPID_CORREO
        sync: false
