<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DEAM">
  <!--
    El iconito de la pestaña. Va en SVG y no en PNG porque escala solo: se ve nitido
    tanto en los 16px de la pestaña como en los 180 de un acceso directo del celular.

    "DEAM" son cuatro letras en 16 pixeles, o sea 4 px por letra. Para que se lean:
    el texto ocupa casi todo el ancho, el espaciado va negativo y el fondo lleva el
    degradado del titulo de la plataforma (#0ea5e9 -> #6366f1), que ademas la hace
    reconocible de lejos aunque las letras no se distingan.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#fondo)"/>
  <text x="32" y="41"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="-1.4"
        fill="#ffffff" text-anchor="middle">DEAM</text>
</svg>
