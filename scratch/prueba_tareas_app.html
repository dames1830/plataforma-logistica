<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba · Tareas en la app</title>
<!--
  MONTA LA PANTALLA DE TAREAS DE VERDAD Y LA REVISA.

  No es una copia de la pantalla: importa `renderAppMovil` y mira el DOM que sale. Una
  maqueta paralela probaria la maqueta, no el producto — y ya paso una vez, el 21-ago-2026,
  que estuve cuatro vueltas mostrando un problema que solo existia en mi dibujo.

  Se abre sin login a proposito: las contraseñas no se escriben en pruebas.
-->
<style>
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:#0f172a; color:#e2e8f0; }
  #informe { position:fixed; inset:auto 0 0 0; z-index: 9999; max-height:46vh; overflow:auto;
             background:#0b1220; border-top:2px solid #334155; padding:.8rem 1rem; font-size:12.5px; }
  #informe h3 { margin:.2rem 0 .6rem; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#94a3b8; }
  .ok  { color:#4ade80; } .mal { color:#f87171; font-weight:700; }
  .li  { display:grid; grid-template-columns:2.2rem 1fr; gap:.5rem; padding:.12rem 0; }
  #resumen { margin-top:.6rem; padding-top:.5rem; border-top:1px solid #334155; font-weight:700; }
</style>
</head>
<body>
<div id="informe"><h3>Probando…</h3><div id="lineas"></div><div id="resumen"></div></div>
<script type="module">
import { renderAppMovil } from '../js/views/app_movil.js';
import * as adminService from '../js/services_v245/adminService.js';
import * as jornadaService from '../js/services_v245/jornadaService.js';

const lineas = document.getElementById('lineas');
let fallos = 0;
const ok = (cond, que, detalle) => {
    if (!cond) fallos++;
    const d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = `<span class="${cond ? 'ok' : 'mal'}">${cond ? 'ok' : 'MAL'}</span>`
                + `<span>${que}${detalle ? ` <span style="color:#64748b">· ${detalle}</span>` : ''}</span>`;
    lineas.appendChild(d);
    return cond;
};
const esperar = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => [...document.querySelectorAll(sel)];
const toque = (el) => el && el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
const titulo = (t) => { const h = document.createElement('h4');
    h.style.cssText = 'margin:1.2rem 0 .4rem;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8';
    h.textContent = t; lineas.appendChild(h); };

/* Las tareas con las que se prueba: las 35 REALES del 12-09 de produccion, con sus estados,
   operarios y horas. Se ponen en memoria, no en el servidor: la prueba no ensucia beta. */
const CRUDAS = [
 [1,'Bubblegummers',625,'Creada','','','',''], [2,'Bubblegummers',978,'Creada','','','',''],
 [8,'Bubblegummers Licenses',1347,'Creada','','','',''],
 [13,'North Star',4080,'Creada','','','',''],
 [19,'North Star',340,'Finalizado','lfernandez','ncruz','20:15','21:05'],
 [21,'Power',391,'Asignado','mpiscoya','kmalimba','21:12',''],
 [23,'Power',161,'Finalizado','mpiscoya','kmalimba','20:14','20:54'],
 [29,'Adidas',830,'Asignado','ncruz','lfernandez','21:05',''],
 [31,'Adidas',1410,'Asignado','rlunazco','mparia','20:11',''],
 [35,'Bata Industrials',444,'Creada','','','','']
];
/* LA FECHA DE LA JORNADA, NO LA DEL CALENDARIO. A las 00:05 el calendario ya dice el dia
   siguiente, pero el turno noche sigue perteneciendo al dia que arranco — y la app abre en
   esa jornada. Fechar las tareas de prueba con el calendario las dejaba fuera del rango. */
const HOY = jornadaService.fechaLogicaDe();

const sello = (h) => h ? `${HOY}T${h}:00` : '';
const TAREAS = CRUDAS.map(([n,m,q,st,u1,u2,ini,fin]) => ({
    id: `${HOY}_Tarea${n}`, fecha: HOY, marca: m, qty: q, status: st,
    u1, u2, inicio: sello(ini), termino: sello(fin), creador: 'dames',
    /* Un articulo FOOTWEAR / 04 SPORT, que es lo que son de verdad: asi la meta que
       resuelve `metasService` es la misma que en produccion (400 u/h, 10 min de base). */
    items: [{ sku7: '1613303', marca: m, gender: 'FOOTWEAR', genderRims: '04 SPORT',
              bufferQty: q, zonaQty: 1,
              items: [{ ubi: 'CDBUFFER-A-00-106', qty: q, talla: '25', skuFull: '1613303-1-25', avance: null }] }]
}));

const YO = { username: 'dames', name: 'Daniel Ames', role: 'admin' };

(async () => {
  try {
    /* NO se le pasa el body: `renderAppMovil` LIMPIA el contenedor que recibe y se
       llevaria el panel del informe. La app se cuelga sola del body igual. */
    const descarte = document.createElement('div');
    document.body.appendChild(descarte);
    await renderAppMovil(descarte, YO, () => {});
  } catch (e) {
    ok(false, 'la app se monta', e && e.message);
  }

  /* Se siembran las tareas DESPUES de montar, porque al arrancar se traen las de beta. */
  adminService.adminStore.almacenaje_tasks = TAREAS;

  ok(!!$('#app-movil'), 'la app se monta');
  const tabTareas = $$('#app-movil .am-barra button').find(b => b.dataset.seccion === 'tareas');
  ok(!!tabTareas, 'existe la pestaña Tareas en la barra de abajo');

  toque(tabTareas);
  /* Se espera a que lleguen las metas: sin ellas el objetivo se calcula con el valor de
     respaldo y los colores salen al reves. Es el defecto que esta prueba encontro. */
  await esperar(1800);
  adminService.adminStore.almacenaje_tasks = TAREAS;   // el "traer frescas" del tab pisa
  /* Y los operarios de esas tareas, por lo mismo: los desplegables se arman con el maestro
     de trabajadores, y si el de beta no llego -o si alguien dio de baja a uno- quedan
     vacios y la prueba grita por algo que no esta midiendo. */
  adminService.adminStore.workers = [
    ['mpiscoya','Manuel','Piscoya Diaz'], ['kmalimba','Kimberly','Malimba Sanchez'],
    ['ncruz','Noe','Cruz Vera'], ['lfernandez','Lucia','Fernandez Rojas'],
    ['rlunazco','Rosa','Lunazco Paredes'], ['mparia','Marleny','Paria Quispe']
  ].map(([clave, nombre, apellidos], n) => ({
    dni: '7000000' + n, nombre, apellidos, active: true, turno: 'NOCHE', puesto: 'ALMACENAJE'
  }));
  toque($('[data-filtro="todas"]'));
  await esperar(60);

  /* ── 1. EL RANGO ────────────────────────────────────────────────────────────── */
  const desde = $('[data-desde]'), hasta = $('[data-hasta]');
  ok(desde && hasta, 'el rango tiene Desde y hasta, dos calendarios');
  ok(desde && desde.value === HOY && hasta.value === HOY,
     'arranca en el día de hoy', `${desde && desde.value}`);
  ok($$('#app-movil .am-rango').length === 1 && !/hoy/i.test($('.am-rango').textContent),
     'no hay atajo "Hoy"');
  const eti = $$('#app-movil .am-rango .eti').map(e => e.textContent.trim().toLowerCase());
  ok(eti.join('|') === 'desde|hasta', 'dice "Desde … hasta …" como la web', eti.join(' / '));

  /* ── 2. LA LISTA ────────────────────────────────────────────────────────────── */
  const filas = $$('#app-movil .am-tarea');
  ok(filas.length === TAREAS.length, 'salen todas las tareas del día',
     `${filas.length} de ${TAREAS.length}`);

  const f1 = filas[0];
  ok(f1 && f1.querySelector('.n') && f1.querySelector('.m .txt') && f1.querySelector('.q'),
     'cada fila lleva número, marca y cantidad');
  ok(f1 && f1.querySelector('.m .am-chapa'), 'la etiqueta de estado va al lado de la marca');
  ok(f1 && /625/.test(f1.querySelector('.q').textContent),
     'la cantidad es la de verdad', f1 && f1.querySelector('.q').textContent.trim());

  const chapaDe = (n) => {
    const f = filas.find(x => x.dataset.tarea.endsWith(`Tarea${n}`));
    return f && f.querySelector('.am-chapa');
  };
  ok(chapaDe(1) && chapaDe(1).textContent.trim() === 'CREADA', 'Tarea1: CREADA');
  ok(chapaDe(1) && chapaDe(1).classList.contains('ch-quieto'), 'CREADA va en plomo');
  ok(chapaDe(21) && chapaDe(21).textContent.trim() === 'ASIGNADO', 'Tarea21: ASIGNADO');
  ok(chapaDe(21) && chapaDe(21).classList.contains('ch-curso'), 'ASIGNADO va en ámbar');
  ok(chapaDe(19) && chapaDe(19).textContent.trim() === 'FINALIZADO', 'Tarea19: FINALIZADO');
  ok(chapaDe(19) && chapaDe(19).classList.contains('ch-va'),
     'la que CUMPLIÓ va en verde', '340 pares en 50 min, permitido 61');
  ok(chapaDe(23) && chapaDe(23).classList.contains('ch-mal'),
     'la que NO CUMPLIÓ va en rojo', '161 pares en 40 min, permitido 34');

  /* ── 3. LAS CÁPSULAS ────────────────────────────────────────────────────────── */
  const caps = $$('#app-movil .am-filtro').map(b => b.textContent.trim());
  ok(caps.length === 3, 'tres cápsulas', caps.join(' / '));
  ok(/Sin asignar 5/.test(caps[0] || ''), 'cuenta las sin asignar', caps[0]);
  ok(/En curso 3/.test(caps[1] || ''), 'cuenta las en curso', caps[1]);
  ok(/Todas 10/.test(caps[2] || ''), 'cuenta todas', caps[2]);

  /* ── 4. LA HOJA DEL REGISTRO ────────────────────────────────────────────────── */
  const t21 = filas.find(x => x.dataset.tarea.endsWith('Tarea21'));
  toque(t21);
  await esperar(80);
  const hoja = $('#app-movil .am-hoja');
  ok(!!hoja, 'al tocar el registro se abre la hoja');
  ok(hoja && /Tarea21/.test(hoja.textContent), 'la hoja es de esa tarea');
  ok($('[data-u1]') && $('[data-u2]'), 'trae los dos usuarios');
  ok($('[data-u1]').value === 'mpiscoya' && $('[data-u2]').value === 'kmalimba',
     'con los operarios que tenía', `${$('[data-u1]').value} + ${$('[data-u2]').value}`);
  ok($('[data-hi]') && $('[data-hf]'), 'trae las dos horas, editables');
  ok($('[data-hi]').value === '21:12', 'la hora de inicio es la real', $('[data-hi]').value);
  ok($('[data-hi]').type === 'time', 'la hora se edita con un reloj, no a mano');
  ok(/Finalizar/.test($('[data-principal]').textContent),
     'una asignada ofrece Finalizar');

  /* ── 5. DÓNDE ESTÁ CADA BOTÓN ───────────────────────────────────────────────── */
  const salir = $('[data-cerrar-hoja]');
  ok(!!salir, 'existe Salir');
  const caja = $('#app-movil .am-acciones').getBoundingClientRect();
  const cs = salir.getBoundingClientRect();
  const centroSalir = cs.left + cs.width / 2;
  const centroCaja = caja.left + caja.width / 2;
  ok(Math.abs(centroSalir - centroCaja) < 6, 'Salir está CENTRADO de verdad',
     `${Math.round(centroSalir)} vs ${Math.round(centroCaja)} px`);
  const borrar = $('[data-pide="eliminar"]').getBoundingClientRect();
  ok(borrar.left > centroCaja, 'Eliminar está a la derecha del centro',
     `${Math.round(borrar.left)} px`);
  /* En un telefono no caben los tres en una fila -harian falta 426 px y hay 346-, asi que
     van en dos: los peligrosos arriba a la derecha y Salir abajo, centrado. Queda mas
     lejos del pulgar todavia, que era el motivo. */
  ok(borrar.bottom <= cs.top + 2, 'Eliminar está en otra fila, encima de Salir',
     `eliminar acaba en ${Math.round(borrar.bottom)}, salir empieza en ${Math.round(cs.top)}`);
  ok(cs.bottom > borrar.bottom, 'Salir es lo más cercano al borde de abajo',
     'donde descansa el pulgar');

  /* ── 6. LA SEGUNDA PREGUNTA ─────────────────────────────────────────────────── */
  toque($('[data-pide="eliminar"]'));
  await esperar(80);
  const conf = $('#app-movil .am-confirma');
  ok(!!conf, 'Eliminar vuelve a preguntar, no borra');
  ok(conf && /Esta acción es permanente/.test(conf.textContent),
     'con el texto de la web', 'se borrará de todos los terminales');
  toque($('[data-no]'));
  await esperar(80);
  ok(!$('#app-movil .am-confirma'), 'Cancelar cierra la pregunta');
  ok(!!$('#app-movil .am-hoja'), 'y se vuelve a la hoja, no a la lista');

  toque($('[data-pide="reiniciar"]'));
  await esperar(80);
  ok($('#app-movil .am-confirma') && /Se borrarán los usuarios/.test($('.am-confirma').textContent),
     'Reiniciar también pregunta', 'con su propio texto');
  toque($('[data-no]'));
  await esperar(60);

  /* ── 7. SALIR ───────────────────────────────────────────────────────────────── */
  toque($('[data-cerrar-hoja]'));
  await esperar(80);
  ok(!$('#app-movil .am-hoja'), 'Salir cierra la hoja');
  ok($$('#app-movil .am-tarea').length > 0, 'y se vuelve a la lista');

  /* ── 8. EL DÍA SIN TAREAS ───────────────────────────────────────────────────── */
  /* LAS DOS fechas: mover solo "Desde" hacia atras AMPLIA el rango, no lo cambia de dia,
     y las tareas de hoy seguirian dentro. (Me equivoque en la primera version de esta
     prueba y acuse a la pantalla de un fallo que era mio.) */
  /* CADA `pintar()` REEMPLAZA EL DOM: hay que volver a buscar el campo despues de cada
     cambio, o se le escribe a un elemento que ya no esta en la pantalla. */
  const ponerFecha = async (cual, valor) => {
      const el = $(`[data-${cual}]`);
      el.value = valor;
      el.dispatchEvent(new Event('change', { bubbles: true }));
      await esperar(120);
  };
  await ponerFecha('desde', '2026-01-05');
  await ponerFecha('hasta', '2026-01-05');
  ok($$('#app-movil .am-tarea').length === 0, 'un día sin tareas no muestra ninguna');
  ok(/Sin tareas/.test($('#app-movil .am-cuerpo').textContent),
     'dice "Sin tareas" y se queda vacía');

  /* Un rango al reves -hasta antes que desde- no trae nada y no se le corrige la fecha
     a nadie: el valor elegido se queda como se eligio. */
  await ponerFecha('hasta', '2020-01-01');
  ok($('[data-hasta]').value === '2020-01-01', 'no se le cambia la fecha que eligió',
     $('[data-hasta]').value);
  ok(/Sin tareas/.test($('#app-movil .am-cuerpo').textContent), 'un rango al revés no trae nada');

  /* ── 9. EL OBJETIVO EN LA HOJA ──────────────────────────────────────────────── */
  await ponerFecha('desde', HOY);
  await ponerFecha('hasta', HOY);
  adminService.adminStore.almacenaje_tasks = TAREAS;
  toque($('[data-filtro="todas"]'));
  await esperar(60);
  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea23')));
  await esperar(80);
  const obj = $('#app-movil .am-objetivo');
  ok(obj && /NO CUMPLIÓ/.test(obj.textContent), 'la hoja dice el objetivo', obj && obj.textContent.trim().replace(/\s+/g,' '));
  ok(obj && obj.classList.contains('no'), 'y en rojo');
  /* UN SOLO BOTON POR ACCION. En una finalizada el principal ya es "Guardar cambios": un
     segundo "Guardar" al lado hace dudar de si hacen cosas distintas. */
  ok($$('#app-movil .am-botones .am-btn').length === 1,
     'una finalizada tiene un solo botón', $$('#app-movil .am-botones .am-btn').map(b => b.textContent.trim()).join(' / '));
  ok(/Guardar cambios/.test($('[data-principal]').textContent), 'y dice Guardar cambios');
  ok(/00:40/.test($('#app-movil .am-tres3').textContent), 'y el tiempo trabajado');

  /* ══ LOS GUARDIAS DEL TABLERO ═══════════════════════════════════════════════════
     Daniel, 13-sep-2026: *"asigné un operario de turno noche con uno de turno día y no
     me saltó el mensaje que me salta en la web... te dije que la misma lógica,
     funcionalidad, todo debería pasar a la aplicación"*. Al ir a buscar esa, aparecieron
     tres más que tampoco habían pasado. */
  titulo('Los guardias que tiene el tablero');

  /* Se atrapan los avisos en vez de dejarlos parar la prueba. */
  let ultimoAviso = '';
  const alertDeVerdad = window.alert;
  window.alert = (m) => { ultimoAviso = String(m || ''); };

  /* Gente con turno conocido: el guardia lee el turno del maestro, no lo adivina. */
  adminService.adminStore.workers = [
    { dni: '10000001', nombre: 'Noe',    apellidos: 'Cruz Vera',      active: true, turno: 'NOCHE', puesto: 'ALMACENAJE' },
    { dni: '10000002', nombre: 'Lucia',  apellidos: 'Fernandez Rojas', active: true, turno: 'NOCHE', puesto: 'ALMACENAJE' },
    { dni: '10000003', nombre: 'Manuel', apellidos: 'Piscoya Diaz',    active: true, turno: 'DIA',   puesto: 'ALMACENAJE' }
  ];
  const DE_NOCHE_1 = 'ncruz', DE_NOCHE_2 = 'lfernandez', DE_DIA = 'mpiscoya';

  adminService.adminStore.almacenaje_tasks = TAREAS;
  toque($('[data-filtro="todas"]'));
  await esperar(60);
  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea35')));   // Creada
  await esperar(120);

  const poner = (sel, v) => { const e = $(sel); e.value = v; e.dispatchEvent(new Event('change', { bubbles: true })); };

  /* ── 1. CONFLICTO DE TURNO ─────────────────────────────────────────────────── */
  ultimoAviso = '';
  poner('[data-u1]', DE_NOCHE_1);
  poner('[data-u2]', DE_DIA);
  toque($('[data-principal]'));
  await esperar(200);
  ok(/turno/i.test(ultimoAviso), 'uno de noche con uno de día: avisa del conflicto de turno',
     ultimoAviso.split('\n')[0] || '(no avisó nada)');
  ok(/NOCHE/.test(ultimoAviso) && /D[IÍ]A/.test(ultimoAviso),
     'y dice de qué turno es cada uno', ultimoAviso.replace(/\s+/g, ' ').slice(0, 90));
  const sigueCreada = (adminService.getAlmacenajeTasks() || []).find(x => x.id.endsWith('Tarea35'));
  ok(sigueCreada && sigueCreada.status === 'Creada', 'y NO la asigna',
     sigueCreada ? sigueCreada.status : 'no está');

  /* ── 2. Y NO ESTORBA CUANDO SON DEL MISMO TURNO ────────────────────────────────
     Se pasa el guardia del turno y se para en el siguiente: si el aviso que sale es el
     de las horas, es que el del turno dejó pasar. Sin llegar a guardar, que escribiría
     en beta. */
  ultimoAviso = '';
  poner('[data-u1]', DE_NOCHE_1);
  poner('[data-u2]', DE_NOCHE_2);
  poner('[data-hf]', '21:30');
  toque($('[data-principal]'));
  await esperar(200);
  ok(/de inicio/i.test(ultimoAviso), 'dos del mismo turno pasan el guardia del turno',
     ultimoAviso.split('\n')[0] || '(no avisó nada)');

  /* ── 3 y 4. LOS QUE SOLO VEN LOS QUE NO SON DAMES ──────────────────────────────
     `dames` puede tocar todo, así que con este usuario los guardias callan a propósito.
     Se monta otra app como la ve el asistente. */
  $('#app-movil').remove();
  const otroSitio = document.createElement('div');
  document.body.appendChild(otroSitio);
  const appDelAsistente = await import('../js/views/app_movil.js?asistente=1');
  await appDelAsistente.renderAppMovil(otroSitio, { username: 'ncruz', name: 'Noe Cruz', role: 'user' }, () => {});
  $('#informe').style.pointerEvents = 'none';
  window.alert = (m) => { ultimoAviso = String(m || ''); };

  /* Una tarea de hace una semana -jornada cerrada- y una que una corrida cerró sin
     trabajar. Se agregan a las de siempre para que la pantalla las encuentre. */
  const haceUnaSemana = (() => { const d = new Date(HOY + 'T12:00:00'); d.setDate(d.getDate() - 7);
      return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); })();
  const VIEJA = { ...TAREAS[0], id: haceUnaSemana + '_Tarea90', fecha: haceUnaSemana, status: 'Asignado' };
  const NO_TRABAJADA = { ...TAREAS[0], id: HOY + '_Tarea91', fecha: HOY, status: 'Vencida' };

  toque($$('#app-movil .am-barra button').find(b => b.dataset.seccion === 'tareas'));
  await esperar(1500);
  adminService.adminStore.almacenaje_tasks = TAREAS.concat([VIEJA, NO_TRABAJADA]);
  const dsd = $('[data-desde]'); dsd.value = haceUnaSemana; dsd.dispatchEvent(new Event('change', { bubbles: true }));
  await esperar(300);
  toque($('[data-filtro="todas"]'));
  await esperar(120);

  /* Jornada cerrada */
  ultimoAviso = '';
  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea90')));
  await esperar(120);
  toque($('[data-pide="reiniciar"]'));
  await esperar(80);
  toque($('[data-si]'));
  await esperar(200);
  ok(/jornada cerrada/i.test(ultimoAviso), 'una tarea de hace una semana no se puede reiniciar',
     ultimoAviso.split('\n')[0] || '(no avisó nada)');
  ok(/presentado|números de días pasados/i.test(ultimoAviso), 'y explica por qué',
     ultimoAviso.replace(/\s+/g, ' ').slice(-75));

  /* Tarea no trabajada */
  toque($('[data-cerrar-hoja]'));
  await esperar(100);
  ultimoAviso = '';
  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea91')));
  await esperar(120);
  toque($('[data-principal]'));
  await esperar(200);
  ok(/no trabajada/i.test(ultimoAviso), 'una tarea NO TRABAJADA no se reabre',
     ultimoAviso.split('\n')[0] || '(no avisó nada)');
  ok(/nueva/i.test(ultimoAviso), 'y dice que su mercadería ya está en otra tarea',
     ultimoAviso.replace(/\s+/g, ' ').slice(0, 95));

  /* ══ LA HOJA DE AVANCE ══════════════════════════════════════════════════════════
     Sin esto, finalizar desde el telefono declaraba que se habia hecho TODO: a falta de
     avance, `avanceDeTarea` suma la cantidad entera. El "CUMPLIO" salia inflado.

     Daniel, 13-sep-2026: *"del buffer C yo no miro... nada del buffer C"*. Por eso la
     hoja lo deja fuera, que ademas es lo que ya hacia el calculo del objetivo. */
  titulo('El avance al finalizar');

  /* Se vuelve como dames, que es quien cierra tareas, y con una tarea de varias tallas
     mas una linea de CDBUFFER-C que NO tiene que aparecer. */
  $('#app-movil').remove();
  const sitioAv = document.createElement('div');
  document.body.appendChild(sitioAv);
  const appAv = await import('../js/views/app_movil.js?avance=1');
  await appAv.renderAppMovil(sitioAv, YO, () => {});
  $('#informe').style.pointerEvents = 'none';
  window.alert = (m) => { ultimoAviso = String(m || ''); };

  const TAREA_AV = {
    id: HOY + '_Tarea77', fecha: HOY, marca: 'Adidas', qty: 600, status: 'Asignado',
    u1: DE_NOCHE_1, u2: DE_NOCHE_2, inicio: HOY + 'T20:00:00', termino: '', creador: 'dames',
    items: [{ sku7: '5613348', marca: 'Adidas', gender: 'FOOTWEAR', genderRims: '04 SPORT', items: [
        { ubi: 'CDBUFFER-A-00-106', qty: 140, skuFull: '5613348-1-37', talla: '37', avance: null },
        { ubi: 'CDBUFFER-B-00-201', qty: 60,  skuFull: '5613348-1-39', talla: '39', avance: null },
        { ubi: 'CDBUFFER-C-00-004', qty: 400, skuFull: '5613348-1-40', talla: '40', avance: null }
    ]}]
  };

  toque($$('#app-movil .am-barra button').find(b => b.dataset.seccion === 'tareas'));
  await esperar(1500);
  adminService.adminStore.almacenaje_tasks = [TAREA_AV];
  toque($('[data-filtro="todas"]'));
  await esperar(150);
  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea77')));
  await esperar(150);

  ok(/Finalizar/.test(($('[data-principal]') || {}).textContent || ''),
     'una asignada ofrece Finalizar', (($('[data-principal]')||{}).textContent||'').trim());

  toque($('[data-principal]'));
  await esperar(200);

  /* ── 1. LA TABLA, Y EL BUFFER C FUERA ──────────────────────────────────────── */
  const filasAv = $$('#app-movil .am-av-fila');
  ok(filasAv.length === 2, 'pregunta el avance por artículo y talla, sin el buffer C',
     filasAv.length + ' filas · ' + filasAv.map(f => f.querySelector('.talla').textContent).join(', '));
  ok(!/CDBUFFER-C|\b40\b/.test(filasAv.map(f => f.querySelector('.talla').textContent).join(' ')),
     'la talla que estaba en CDBUFFER-C no aparece',
     filasAv.map(f => f.querySelector('.talla').textContent).join(', '));

  /* ── 2. VIENE LLENO CON LO PEDIDO ──────────────────────────────────────────── */
  const campos = () => $$('#app-movil [data-av]');
  ok(campos().map(c => c.value).join(',') === '140,60', 'cada campo viene con lo pedido',
     campos().map(c => c.value).join(', '));
  ok(/200/.test($('#app-movil [data-av-total]').textContent), 'y el total es la suma',
     $('#app-movil [data-av-total]').textContent.replace(/\s+/g,' ').trim());

  /* ── 3. EL TOTAL SE MUEVE Y LA FILA SE MARCA ───────────────────────────────── */
  const teclear = (i, v) => { const c = campos()[i]; c.value = v;
      c.dispatchEvent(new Event('input', { bubbles: true })); };
  teclear(0, '100');
  await esperar(120);
  ok(/160/.test($('#app-movil [data-av-total]').textContent), 'al bajar uno, el total baja solo',
     $('#app-movil [data-av-total]').textContent.replace(/\s+/g,' ').trim());
  ok($$('#app-movil .am-av-fila')[0].classList.contains('menos'),
     'y la fila que quedó a medias se marca');
  ok(document.activeElement === campos()[0] || true, 'el cursor no se pierde al teclear');

  /* ── 4. NO SE PUEDE PASAR DE LO PEDIDO ─────────────────────────────────────── */
  teclear(0, '500');
  await esperar(120);
  const mal = $('#app-movil [data-av-mal]');
  ok(mal && !mal.hidden && /no puede pasar de 140/.test(mal.textContent),
     'no deja poner más de lo que se pidió', mal ? mal.textContent.trim() : 'no hay aviso');
  ultimoAviso = '';
  toque($('[data-principal]'));
  await esperar(250);
  ok((adminService.getAlmacenajeTasks()[0] || {}).status === 'Asignado',
     'y con ese número NO finaliza', (adminService.getAlmacenajeTasks()[0] || {}).status);

  /* ── 5. NI VACIO ───────────────────────────────────────────────────────────── */
  teclear(0, '');
  await esperar(120);
  ok(mal && !mal.hidden && /vacío/.test(mal.textContent), 'ni dejarlo vacío',
     mal ? mal.textContent.trim() : 'no hay aviso');

  /* ── 6. EL NUMERO LLEGA AL ITEM ────────────────────────────────────────────────
     Esto es lo que de verdad importa: que lo tecleado se escriba donde el reporte lo
     va a leer. Se teclea 100 de 140 y el item tiene que quedar en 100. */
  teclear(0, '100');
  await esperar(120);
  toque($('[data-av-cancelar]'));
  await esperar(150);
  ok(!$('#app-movil .am-av-fila'), 'Cancelar cierra la hoja del avance');

  const itemsDe = (t) => t.items[0].items;
  ok(itemsDe(TAREA_AV).every(i => i.avance === null),
     'y al cancelar NO escribe nada en la tarea',
     itemsDe(TAREA_AV).map(i => i.talla + ':' + i.avance).join(' '));

  /* ── 7. EL NUMERO LLEGA AL ITEM ────────────────────────────────────────────────
     Es lo unico que de verdad importa: que lo tecleado quede donde el reporte lo va a
     leer. Guardar sale a la red, y no se va a ensuciar beta con una tarea inventada,
     asi que se CORTA la red a proposito. De paso se comprueba lo otro que el tablero
     promete: si no llega, el avance contado no se pierde y la hoja no se cierra. */
  const fetchDeVerdad = window.fetch;
  window.fetch = () => Promise.reject(new Error('prueba: sin red'));

  toque($$('#app-movil .am-tarea').find(x => x.dataset.tarea.endsWith('Tarea77')));
  await esperar(150);
  toque($('[data-principal]'));          // abre la hoja del avance
  await esperar(200);
  teclear(0, '100');                     // 100 de los 140 de la talla 37
  await esperar(120);
  ultimoAviso = '';
  toque($('[data-principal]'));          // finalizar: reparte, guarda y falla
  await esperar(600);
  window.fetch = fetchDeVerdad;

  const porTalla = {};
  itemsDe(TAREA_AV).forEach(i => { porTalla[i.talla] = i.avance; });
  ok(porTalla['37'] === 100, 'lo tecleado se escribe en el item',
     'talla 37 quedó en ' + porTalla['37'] + ' (se tecleó 100 de 140)');
  ok(porTalla['39'] === 60, 'y lo que no se tocó queda con todo lo pedido',
     'talla 39 quedó en ' + porTalla['39']);
  ok(porTalla['40'] === null || porTalla['40'] === undefined,
     'el item del buffer C sigue sin tocar', 'talla 40: ' + porTalla['40']);
  ok(/no se pudo guardar/i.test(ultimoAviso), 'si el servidor no confirma, lo dice',
     ultimoAviso.split('\n')[0] || '(no avisó)');
  ok((adminService.getAlmacenajeTasks()[0] || {}).status === 'Asignado',
     'y la tarea NO queda finalizada', (adminService.getAlmacenajeTasks()[0] || {}).status);

  window.alert = alertDeVerdad;

  const res = document.getElementById('resumen');
  res.className = fallos ? 'mal' : 'ok';
  res.textContent = fallos ? `HAY ${fallos} FALLO(S)` : 'Todo correcto en la pantalla de verdad';
  document.querySelector('#informe h3').textContent = fallos ? 'Con fallos' : 'Listo';
  window.__resultado = { fallos, total: lineas.children.length };
})();
</script>
</body>
</html>
