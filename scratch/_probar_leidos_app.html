<div id="app"></div>
<script type="module">
/* LA APP DEL CELULAR DE VERDAD, contra el servidor de prueba de esta PC. Nada de esta pagina

const q = new URLSearchParams(location.search);
window.API_BASE_URL = 'http://127.0.0.1:8021';
try {
    localStorage.setItem('deam_id_telefono', q.get('aparato') || 'cel');
    localStorage.removeItem('deam_chat_memoria_dames');
} catch (e) { /* da igual */ }
const APP = await import('../js/views/app_movil.js?nocache=' + Date.now());
await APP.renderAppMovil(document.getElementById('app'),
    { username: 'dames', name: 'DANIEL AMES', role: 'admin', token: '' }, () => {});
window.__listo = true;
</script>
