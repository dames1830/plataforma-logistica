<!-- La cámara del Replenishment: el resumen y cuántas paletas amarra.
     Saca del archivo de verdad la simulación de paletas y la corre contra un caso a mano,
     donde la respuesta se puede contar con los dedos. -->
<meta charset="utf-8">
<title>Prueba: la cámara del Replenishment</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/temas.css">
<link rel="stylesheet" href="../css/componentes.css">
<style>
  body{margin:0;padding:20px;background:var(--panel-deeper);font:13px/1.85 system-ui,sans-serif;color:var(--text-muted)}
  #eco{max-width:1000px;margin:0 auto 16px;white-space:pre-wrap}
  #lienzo{max-width:1000px;margin:0 auto;display:flex;gap:14px;flex-wrap:wrap}
  #lienzo figcaption{font-size:11.5px;color:var(--text-muted);margin-bottom:5px}
  b{color:var(--success)} .mal{color:var(--danger);font-weight:700} .t{color:var(--brand-light);font-weight:700}
</style>
<div id="eco"></div>
<div id="lienzo"></div>
<script type="module">
const eco = (t) => document.getElementById('eco').innerHTML += t + '\n';
let fallas = 0, llegoAlFinal = false;
const ok = (n, c) => { eco((c ? '<b>OK</b>  ' : '<span class="mal">MAL</span> ') + n); if (!c) fallas++; };
window.addEventListener('error', e => { fallas++; eco('<span class="mal">SE CORTO</span> ' + e.message); });
setTimeout(() => { if (!llegoAlFinal) eco('\n<span class="mal">LA PRUEBA NO LLEGO AL FINAL.</span>'); }, 15000);

const CR = String.fromCharCode(13);
const src = (await (await fetch('../js/views/dashboard_v28.js?z=' + Date.now())).text()).split(CR).join('');
const LAM = await import('../js/services_v245/laminas.js?z=' + Date.now());
document.documentElement.setAttribute('data-tema', 'pbi');

eco('<span class="t">── EL BOTÓN ──</span>');
ok('está al lado del de Excel', /repl_foto[^]{0,220}repl_export/.test(src));
ok('usa btn-icono, o sea sin fondo ni borde', /id="repl_foto" class="btn-icono"/.test(src));
ok('y tiene title, que con solo dibujo es obligatorio',
   /repl_foto[^>]*title="Armar la lámina/.test(src));

eco('\n<span class="t">── CUÁNTAS PALETAS AMARRA ──</span>');
/* Se saca la función de verdad y se le entregan sus piezas: los pares no bajan sueltos,
   bajan dentro de paletas, y una paleta trae varias tallas del mismo artículo. */
const d = src.indexOf('    const paletasQueAmarra = () => {');
const h = src.indexOf('    const estadoColor = {');
ok('se encontró la simulación', d > 0 && h > d);
const trozo = src.slice(d, h);
const getCol = (fila, nombres) => { for (const n of nombres) if (fila[n] !== undefined) return fila[n]; return ''; };
const armar = (items, reserva) => new Function('items', 'reserva', 'getCol', 'aBajarDe',
  trozo + '\n return paletasQueAmarra;')(items, reserva, getCol, (i) => i.aBajar);

/* Un caso que se cuenta con los dedos:
     piden  A=100  B=50
     P1 tiene A=80        P2 tiene A=30 y B=40        P3 tiene B=20
     P4 tiene C=999, que nadie pidió — no cuenta.
   Se toman las que más tapan: P1 (80), luego P2 (70), luego P3 (20). */
const items = [{ sku: 'A', aBajar: 100 }, { sku: 'B', aBajar: 50 }];
const ALTO = 'RESERVA ALTO';
const reserva = [
  { NIVEL: ALTO, LPN: 'P1', PRODUCTO: 'A', CANTIDAD: 80 },
  { NIVEL: ALTO, LPN: 'P2', PRODUCTO: 'A', CANTIDAD: 30 },
  { NIVEL: ALTO, LPN: 'P2', PRODUCTO: 'B', CANTIDAD: 40 },
  { NIVEL: ALTO, LPN: 'P3', PRODUCTO: 'B', CANTIDAD: 20 },
  { NIVEL: ALTO, LPN: 'P4', PRODUCTO: 'C', CANTIDAD: 999 },
  /* Nivel bajo: el análisis no lo cuenta como reserva, así que la simulación tampoco.
     Si lo contara, las dos mitades de la lámina medirían universos distintos. */
  { NIVEL: 'VER', LPN: 'P5', PRODUCTO: 'A', CANTIDAD: 999 }
];
const r = armar(items, reserva)();
ok('hacen falta 3 paletas — salieron ' + r.paletas, r.paletas === 3);
ok('y cubren los 150 pares — cubrieron ' + r.cubren, r.cubren === 150);
ok('la paleta que nadie pidió no cuenta', r.paletas !== 4);
ok('y la que no está en nivel ALTO tampoco — si contara, sobrarían pares',
   r.paletas === 3 && r.cubren === 150);

/* Con una sola paleta que tape todo, es una sola: no se bajan de más. */
const r2 = armar([{ sku: 'A', aBajar: 10 }],
  [{ NIVEL: ALTO, LPN: 'P1', PRODUCTO: 'A', CANTIDAD: 500 },
   { NIVEL: ALTO, LPN: 'P2', PRODUCTO: 'A', CANTIDAD: 500 }])();
ok('con una que alcanza, no baja dos — salió ' + r2.paletas, r2.paletas === 1);

/* Si arriba no hay para todo, se dice: cubren menos que lo pedido. */
const r3 = armar([{ sku: 'A', aBajar: 100 }],
  [{ NIVEL: ALTO, LPN: 'P1', PRODUCTO: 'A', CANTIDAD: 30 }])();
ok('si arriba no alcanza, cubre menos: ' + r3.cubren + ' de ' + r3.pedido,
   r3.cubren === 30 && r3.pedido === 100);
ok('sin nada que bajar, cero paletas', armar([], reserva)().paletas === 0);
/* La lámina YA NO lleva las paletas: ese análisis lo hace otro módulo y dos sitios
   diciendo lo mismo con números distintos es peor que uno solo. La simulación queda en el
   código por si se retoma, y por eso se sigue probando arriba. */
/* Se mira SOLO la llamada de la lámina, no el archivo entero: la frase "las paletas que
   hay que bajar" también está en un comentario de otro módulo, y buscarla suelta hacía
   fallar la comprobación por algo que no tiene nada que ver. */
const llamada = src.slice(src.indexOf("laminaResumen({"),
                          src.indexOf("laminaResumen({") + 700);
ok('la lámina no muestra las paletas', !/grande:/.test(llamada));
ok('y solo lleva las tres cifras que pidió Daniel',
   /rotulo: 'QUEBRADOS'[^]{0,400}rotulo: 'POR QUEBRAR'[^]{0,400}rotulo: 'PARES A BAJAR'/.test(src)
   && !/grande: \{ rotulo: 'PALETAS/.test(src));

eco('\n<span class="t">── LA LÁMINA, EN LOS CUATRO TEMAS ──</span>');
/* Con las cifras reales de la corrida del 27-ago. */
const CIFRAS = { quebrados: 240, porQuebrar: 834, pares: 107328 };   // la corrida ya sin lo que no es calzado
let ultima = null;
for (const tema of ['indigo', 'pbi', 'pbi-classic', 'negro']) {
  document.documentElement.setAttribute('data-tema', tema);
  const cv = LAM.laminaResumen({
    titulo: 'REPOSICIÓN AL PISO',
    tarjetas: [
      { rotulo: 'QUEBRADOS', valor: CIFRAS.quebrados, color: 'var(--danger)' },
      { rotulo: 'POR QUEBRAR', valor: CIFRAS.porQuebrar, color: 'var(--warning)' },
      { rotulo: 'PARES A BAJAR', valor: CIFRAS.pares, color: 'var(--brand-light)' }
    ],
    pie: 'Solo calzado'
  });
  const fondo = [...document.querySelectorAll('body > div')].pop();
  ok(tema + ': dibujó ' + cv.width + '×' + cv.height, cv.width > 0);
  const fig = document.createElement('figure');
  fig.style.margin = '0';
  fig.innerHTML = '<figcaption>' + tema + '</figcaption>';
  const copia = document.createElement('canvas');
  copia.width = cv.width; copia.height = cv.height;
  copia.style.cssText = 'width:300px;height:auto;border-radius:8px;display:block';
  copia.getContext('2d').drawImage(cv, 0, 0);
  fig.appendChild(copia);
  document.getElementById('lienzo').appendChild(fig);
  ultima = fondo;
  if (tema !== 'negro') [...fondo.querySelectorAll('button')].pop().click();
}

eco('\n<span class="t">── LAS TRES SALIDAS Y EL COPIAR ──</span>');
const bots = [...ultima.querySelectorAll('button')].map(b => b.textContent);
ok('hay Copiar y Cerrar — ' + bots.join(' · '), bots.length === 2 && /Copiar/.test(bots[0]));
const real = navigator.clipboard;
let entregado = null;
Object.defineProperty(navigator, 'clipboard', { configurable: true,
  value: { write: (its) => { entregado = its; return Promise.resolve(); } } });
[...ultima.querySelectorAll('button')][0].click();
await new Promise(res => setTimeout(res, 150));
ok('Copiar entrega una imagen PNG', !!entregado && entregado[0].types.indexOf('image/png') !== -1);
Object.defineProperty(navigator, 'clipboard', { configurable: true, value: real });
document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
ok('la tecla Esc cierra la ventana', !ultima.isConnected);

eco('\n<span class="t">── EL FORMATO, QUE ES CERRADO ──</span>');
ok('la cifra se encoge si no entra —195.226 en una tarjeta de cuatro—',
   /while \(tam > 12 && g\.measureText\(v\)\.width > anchoT - 12\)/.test(
     await (await fetch('../js/services_v245/laminas.js?z=' + Date.now())).text()));
ok('la lámina no lleva tablas ni listas: solo el resumen',
   !/forEach\(fila/.test(trozo));

eco('\n<span class="t">── LOS COLORES SON EL DATO ──</span>');
/* Daniel: "ponle colores, los quebrados en rojo, por quebrar en amarillo". Se comprueba
   leyendo los PUNTOS del dibujo: el tono que sale tiene que ser el del tema, no uno
   oscurecido. */
document.documentElement.setAttribute('data-tema', 'pbi');
const rojoTema = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim();
/* SE LE PASA 'var(--danger)', que es lo que hace la pantalla de verdad. Antes esta prueba
   le entregaba el color ya resuelto y por eso no vio el defecto: un lienzo NO entiende
   var(), lo descarta en silencio y sigue pintando con el color anterior —las cifras salían
   todas grises—. Una prueba que no recorre el camino de verdad no prueba nada. */
const cv2 = LAM.laminaResumen({
  titulo: 'PRUEBA', tarjetas: [{ rotulo: 'QUEBRADOS', valor: 248, color: 'var(--danger)' }],
  pie: ''
});
const vent2 = [...document.querySelectorAll('body > div')].pop();
const escD = cv2.width / 460;
/* Sin número grande la tarjeta se estira: la cifra queda más abajo. */
const px = cv2.getContext('2d').getImageData(
  Math.round(30 * escD), Math.round(163 * escD), Math.round(180 * escD), Math.round(40 * escD)).data;
let masRojo = null, mejor = -1;
for (let i = 0; i < px.length; i += 4) {
  const d = px[i] - Math.max(px[i + 1], px[i + 2]);
  if (d > mejor) { mejor = d; masRojo = [px[i], px[i + 1], px[i + 2]]; }
}
const bril = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
const brilloTema = bril(LAM.aRGB(rojoTema));
ok('el rojo sale con el brillo del tema (' + bril(masRojo).toFixed(2)
   + ' contra ' + brilloTema.toFixed(2) + '), no oscurecido',
   Math.abs(bril(masRojo) - brilloTema) < 0.08);
ok('y es rojo de verdad, no gris ni marrón', masRojo[0] - Math.max(masRojo[1], masRojo[2]) > 60);
ok('sin número grande, las tarjetas se estiran y no queda un hueco abajo',
   /const altoT = grande \? 66 : 162;/.test(
     await (await fetch('../js/services_v245/laminas.js?z=' + Date.now())).text()));
[...vent2.querySelectorAll('button')].pop().click();

document.documentElement.setAttribute('data-tema', 'pbi');
llegoAlFinal = true;
eco(fallas ? '\n<span class="mal">' + fallas + ' FALLARON</span>'
           : '\n<b>La simulación cuenta bien las paletas y la lámina sale en los cuatro temas.</b>');
</script>
