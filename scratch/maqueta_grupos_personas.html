<!-- MAQUETA: el panel de KPI queda con DOS pestañas —Grupos y Personas—, las dos por hora,
     con su rango de fechas y su cámara para WhatsApp. Producto se va.
     Los datos van adentro: se abre con doble clic desde cualquier lado. -->
<meta charset="utf-8">
<title>Maqueta · Grupos y Personas por hora</title>
<style>
  :root {
    color-scheme: dark;
    --fondo:#0b0e15; --panel:#151a24; --ink:232,236,244;
    --texto:#e8ecf4; --suave:#99a3ba; --marca:#8b93f8; --marca-rgb:139,147,248;
    --sombra:8,11,18; --ok:#34d399; --alerta:#fbbf24; --mal:#f87171;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:22px; background:var(--fondo); font-family:system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:1560px; margin:0 auto; }
  h1 { color:var(--texto); font-size:19px; margin:0 0 3px; }
  .sub { color:var(--suave); font-size:13px; margin-bottom:16px; }

  .panel { background:var(--panel); border:1px solid rgba(var(--ink),0.16); border-radius:12px; overflow:hidden; }
  .barra { display:flex; align-items:center; gap:8px; padding:10px 14px; flex-wrap:wrap;
    border-bottom:1px solid rgba(var(--ink),0.10); }
  .barra .et { font-size:11px; color:rgba(var(--marca-rgb),0.85); font-weight:800; letter-spacing:.5px; }
  input[type=date] { padding:5px 8px; border-radius:7px; border:1px solid rgba(var(--marca-rgb),0.4);
    background:rgba(var(--ink),0.05); color:var(--texto); font-size:12px; font-weight:700; font-family:inherit; }
  .bt { padding:5px 11px; border-radius:7px; border:1px solid rgba(var(--marca-rgb),0.4);
    background:rgba(var(--ink),0.05); color:var(--marca); font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; }
  /* El icono va SOLO: sin marco ni fondo, como los demas iconos del tablero. */
  .bt.foto { border:none; background:none; font-size:19px; padding:2px 4px; line-height:1; }
  .bt.foto:hover { opacity:.75; }

  .nav { display:flex; border-bottom:1px solid rgba(var(--ink),0.12); }
  .nav button { flex:1; min-width:170px; text-align:left; padding:.75rem 1rem; cursor:pointer;
    background:transparent; border:none; border-bottom:2px solid transparent; font-family:inherit; }
  .nav button.on { background:rgba(var(--marca-rgb),0.14); border-bottom-color:var(--marca); }
  .nav .t { color:rgba(var(--ink),0.55); font-weight:900; font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
  .nav button.on .t { color:var(--texto); }
  .nav .s { color:rgba(var(--ink),0.28); font-size:11px; margin-top:2px; }
  .nav button.on .s { color:rgba(var(--marca-rgb),0.85); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { padding:.6rem .5rem; text-align:center; font-weight:700; font-size:11px; color:var(--suave);
    text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid rgba(var(--ink),0.12); }
  thead th.izq { text-align:left; padding-left:1rem; }
  td { padding:.55rem .5rem; text-align:center; border-bottom:1px solid rgba(var(--ink),0.05);
    color:var(--texto); font-variant-numeric:tabular-nums; }
  td.izq { text-align:left; padding-left:1rem; }
  tr.dia { cursor:pointer; } tr.dia:hover { background:rgba(var(--ink),0.04); }
  tr.dia td { font-weight:800; }
  tr.hijo td { background:rgba(var(--sombra),0.30); font-size:12.5px; }
  tr.hijo td.izq { padding-left:2.7rem; color:var(--suave); }
  .cero { color:rgba(var(--ink),0.20); }
  .tot { color:var(--marca); font-weight:900; background:rgba(var(--marca-rgb),0.07); }
  tr.total td { background:rgba(var(--marca-rgb),0.12); font-weight:900; border-top:2px solid rgba(var(--ink),0.12); }
  .ic { color:var(--marca); font-weight:900; }
  .chico { font-size:10.5px; color:rgba(var(--ink),0.34); margin-left:7px; }
  .pie { padding:.8rem 1rem; font-size:11.5px; color:rgba(var(--ink),0.42); line-height:1.75; }
  .pie b { color:var(--alerta); }

  /* La foto: blanco y negro, como el otro reporte, porque WhatsApp la comprime */
  #capa { position:fixed; inset:0; z-index:99; background:rgba(8,12,20,.88); display:none;
    align-items:center; justify-content:center; padding:22px; overflow:auto; }
  #capa.ver { display:flex; }
  .ctrl { display:flex; gap:7px; align-items:center; margin-bottom:9px; justify-content:flex-end; }
  .ctrl button { padding:5px 12px; border-radius:8px; border:1px solid #fff; background:transparent;
    color:#fff; font-weight:800; font-size:12px; cursor:pointer; font-family:inherit; }
  .ctrl button.on { background:#fff; color:#12365c; }
  .ayuda { color:#9fb3cc; font-size:11px; text-align:right; margin-top:9px; line-height:1.6; max-width:540px; }
  .ayuda b { color:#fff; }
</style>

<div class="wrap">
  <h1>Panel de rendimiento — como quedaría</h1>
  <div class="sub">Dos pestañas, las dos por hora. Con sus datos reales del 23 al 26 de agosto.</div>

  <div class="panel">
    <div class="barra">
      <span class="et">📅 DE:</span><input type="date" id="desde">
      <span class="et">HASTA:</span><input type="date" id="hasta">
      <button class="bt foto" id="btFoto" title="Verlo en chico para mandar por WhatsApp">📷</button>

    <div class="nav">
      <button data-v="grupos" class="on"><div class="t">👥 Grupos</div><div class="s">¿Cómo avanza cada grupo por hora?</div></button>
      <button data-v="personas"><div class="t">🧑 Personas</div><div class="s">¿Cómo avanza cada persona por hora?</div></button>
    </div>
    <div style="overflow-x:auto;"><table id="tabla"></table></div>
    <div class="pie" id="pie"></div>
  </div>
</div>

<div id="capa"><div><div class="ctrl" id="ctrl"></div><div id="fotoCaja"></div><div class="ayuda">

  Mándelo en <b>Grande</b>: WhatsApp achica la imagen igual, y una foto grande llega nítida.

": 396}, "t": 1}}, "2026-08-24": {"scasahuaman": {"h": {"1": 237, "21": 354, "2": 350, "4": 256, "22": 68}, "t": 5}, "kcasahuaman": {"h": {"1": 237, "21": 354, "22": 67}, "t": 3}, "mbravo": {"h": {"1": 188, "21": 248, "0": 183, "4": 374}, "t": 5}, "jmaicelo": {"h": {"1": 188, "21": 248, "0": 183, "4": 373}, "t": 5}, "achaqquere": {"h": {"0": 188, "21": 181, "22": 159, "2": 350, "4": 256}, "t": 6}, "galata": {"h": {"0": 187, "21": 181, "22": 158}, "t": 4}, "jbarazorda": {"h": {"0": 324, "21": 565, "1": 161, "2": 110, "22": 104, "6": 462, "3": 172}, "t": 8}, "jyauyo": {"h": {"0": 324, "21": 97, "1": 161, "2": 110, "22": 103, "6": 462, "3": 172}, "t": 7}, "mzarzosa": {"h": {"22": 120}, "t": 1}, "drodriguez": {"h": {"22": 120}, "t": 1}, "cmoreano": {"h": {"3": 30, "0": 183, "22": 8}, "t": 3}, "eleon": {"h": {"3": 30, "0": 183, "22": 7}, "t": 3}, "jramos": {"h": {"21": 467}, "t": 1}, "rrodriguez": {"h": {"22": 323, "0": 138}, "t": 2}, "jcasafrancaá": {"h": {"22": 322, "0": 138}, "t": 2}}, "2026-08-23": {"jyauyo": {"h": {"20": 1665}, "t": 1}, "pmurayari": {"h": {"20": 1665}, "t": 1}}}};

<script>
const HORAS = [20,21,22,23,0,1,2,3,4,5,6];
const nMil = (n) => Math.round(Number(n)||0).toLocaleString('es-PE');
const fmt = (f) => f.split('-').reverse().join('/');
const totalDe = (h) => HORAS.reduce((a,x) => a + (Number(h[x])||0), 0);

let vista = 'grupos', escala = 2;
const abiertas = new Set();
const TODOS = Object.keys(DATOS.grupos).sort();
const HOY = TODOS[TODOS.length-1];
let desde = HOY, hasta = HOY;

const diasEnRango = () => TODOS.filter(f => f >= desde && f <= hasta).sort().reverse();

/* Arma las filas de la vista activa. Es la misma tabla para las dos pestañas: lo único
   que cambia es si las filas hijas son grupos o personas. */
const armar = () => {
  const fuente = DATOS[vista];
  const dias = diasEnRango();
  const granTot = {};
  const filas = [];
  dias.forEach(f => {
    const hijos = fuente[f] || {};
    const suma = {};
    Object.values(hijos).forEach(g => HORAS.forEach(x => { suma[x] = (suma[x]||0) + (Number(g.h[x])||0); }));
    HORAS.forEach(x => { granTot[x] = (granTot[x]||0) + (suma[x]||0); });
    filas.push({ tipo:'dia', f, suma, n:Object.keys(hijos).length });
    if (abiertas.has(f)) {
      Object.entries(hijos).sort((a,b) => totalDe(b[1].h) - totalDe(a[1].h))
        .forEach(([nom, v]) => filas.push({ tipo:'hijo', nom, h:v.h, t:v.t }));
    }
  });
  return { filas, granTot, dias };
};

const pintar = () => {
  const { filas, granTot, dias } = armar();
  const et = vista === 'grupos' ? 'grupos' : 'personas';
  let h = `<thead><tr><th class="izq" style="width:250px;">Fecha · ${vista === 'grupos' ? 'Grupo' : 'Persona'}</th>
    ${HORAS.map(x => `<th>${String(x).padStart(2,'0')}:00</th>`).join('')}
    <th style="width:92px;">Total</th></tr></thead><tbody>`;

  if (!filas.length) h += `<tr><td colspan="${HORAS.length+2}" style="padding:3rem; color:rgba(var(--ink),0.3);">Sin producción en el rango.</td></tr>`;

  filas.forEach(r => {
    if (r.tipo === 'dia') {
      h += `<tr class="dia" onclick="toggle('${r.f}')"><td class="izq"><span class="ic">${abiertas.has(r.f)?'▾':'▸'}</span> &nbsp;${fmt(r.f)}<span class="chico">${r.n} ${et}</span></td>
        ${HORAS.map(x => `<td class="${r.suma[x]?'':'cero'}">${r.suma[x]?nMil(r.suma[x]):'–'}</td>`).join('')}
        <td class="tot">${nMil(totalDe(r.suma))}</td></tr>`;
    } else {
      h += `<tr class="hijo"><td class="izq">${r.nom}<span class="chico">${r.t} ${r.t===1?'tarea':'tareas'}</span></td>
        ${HORAS.map(x => `<td class="${r.h[x]?'':'cero'}">${r.h[x]?nMil(r.h[x]):'–'}</td>`).join('')}
        <td class="tot">${nMil(totalDe(r.h))}</td></tr>`;
    }
  });

  h += `<tr class="total"><td class="izq">TOTAL</td>
    ${HORAS.map(x => `<td class="${granTot[x]?'':'cero'}">${granTot[x]?nMil(granTot[x]):'–'}</td>`).join('')}
    <td class="tot">${nMil(totalDe(granTot))}</td></tr></tbody>`;
  document.getElementById('tabla').innerHTML = h;

  /* EN PERSONAS LA SUMA NO ES LA PRODUCCIÓN DE LA NOCHE, Y HAY QUE DECIRLO.
     Cada tarea la hacen dos, y a cada uno se le anota completa: por eso el total de
     Personas da el doble que el de Grupos. Es lo correcto para medir a la persona
     -participó en esos pares- pero se lee mal si nadie lo aclara. */
  const real = dias.reduce((a,f) => a + Object.values(DATOS.grupos[f]||{}).reduce((s,g) => s + totalDe(g.h), 0), 0);
  document.getElementById('pie').innerHTML = vista === 'grupos'
    ? `Clic en una jornada para ver sus grupos. Cada grupo va acumulado: si hizo tres tareas, es una sola fila.`
    : `Clic en una jornada para ver a cada persona. Lo que hace un grupo se parte entre sus dos `
      + `integrantes; si es impar, el par de más va al primero. Por eso el total coincide con el de Grupos: `
      + `<b>${nMil(real)}</b>.`;
};

window.toggle = (f) => { abiertas.has(f) ? abiertas.delete(f) : abiertas.add(f); pintar(); };

document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); vista = b.dataset.v; pintar();
}));
const sincronizar = () => {
  document.getElementById('desde').value = desde;
  document.getElementById('hasta').value = hasta;
};
document.getElementById('desde').addEventListener('change', e => {
  desde = e.target.value || HOY; if (desde > hasta) hasta = desde; sincronizar(); pintar();
});
document.getElementById('hasta').addEventListener('change', e => {
  hasta = e.target.value || HOY; if (hasta < desde) desde = hasta; sincronizar(); pintar();
});

// ── LA FOTO ────────────────────────────────────────────────────────────────────
const fotoDe = (E) => {
  const px = (n) => Math.round(n*E) + 'px';
  const { filas, granTot, dias } = armar();

  /* TODO VA ESCRITO EN CADA CELDA: tamaño, color, peso, alineación y relleno.
     Nada se deja heredar. El CSS de la pantalla tiene reglas para `thead th` y para `td`
     -color y tamaño de letra- que le ganan a lo que herede la tabla de la foto. Por eso
     los nombres salían en blanco sobre blanco y el encabezado en letra chica: no era la
     foto, era la hoja de estilos de atrás pisándola. Ya me pasó dos veces. */
  const BASE = `font-family:Arial, sans-serif; font-size:${px(11)}; letter-spacing:normal; text-transform:none;`;
  const TH = `${BASE} padding:${px(5)} ${px(5)}; text-align:center; background:#12365c; color:#fff; font-weight:700; border:none;`;
  const TD = `${BASE} padding:${px(4)} ${px(5)}; text-align:center; border-bottom:1px solid #e3e7ee; color:#111; font-weight:400;`;
  const rango = desde === hasta ? fmt(desde) : `${fmt(desde)} al ${fmt(hasta)}`;

  let f = `<div style="background:#fff; color:#111; padding:${px(14)} ${px(16)}; border-radius:${px(10)}; font-family:Arial, sans-serif;">
    <div style="${BASE} font-size:${px(15)}; font-weight:900; color:#111;">PRODUCCIÓN POR HORA · ${vista === 'grupos' ? 'GRUPOS' : 'PERSONAS'}</div>
    <div style="${BASE} color:#666; margin-bottom:${px(9)};">${rango} · unidades almacenadas</div>
    <table style="border-collapse:collapse;"><thead><tr>
      <th style="${TH} text-align:left; padding-left:${px(8)};">${vista === 'grupos' ? 'GRUPO' : 'PERSONA'}</th>
      ${HORAS.map(x => `<th style="${TH}">${String(x).padStart(2,'0')}:00</th>`).join('')}
      <th style="${TH} padding-left:${px(8)}; padding-right:${px(8)};">TOTAL</th></tr></thead><tbody>`;

  let i = 0;
  filas.forEach(r => {
    const esDia = r.tipo === 'dia';
    const nom = esDia ? fmt(r.f) : r.nom;
    const hh = esDia ? r.suma : r.h;
    const fondo = esDia ? '#dbe4f0' : (i++ % 2 ? '#f4f6f9' : '#fff');
    f += `<tr>
      <td style="${TD} background:${fondo}; text-align:left; padding-left:${px(esDia ? 8 : 20)}; font-weight:${esDia ? 900 : 700}; color:#111; white-space:nowrap;">${nom}</td>
      ${HORAS.map(x => `<td style="${TD} background:${fondo}; color:${hh[x] ? '#111' : '#c3c9d4'};">${hh[x] ? nMil(hh[x]) : '-'}</td>`).join('')}
      <td style="${TD} background:#e7edf6; padding-left:${px(8)}; padding-right:${px(8)}; font-weight:900; color:#111;">${nMil(totalDe(hh))}</td></tr>`;
  });

  f += `</tbody><tfoot><tr>
      <td style="${TD} background:#12365c; color:#fff; font-weight:900; text-align:left; padding-left:${px(8)};">TOTAL</td>
      ${HORAS.map(x => `<td style="${TD} background:#12365c; color:#fff; font-weight:900;">${granTot[x] ? nMil(granTot[x]) : '-'}</td>`).join('')}
      <td style="${TD} background:#12365c; color:#fff; font-weight:900; padding-left:${px(8)}; padding-right:${px(8)};">${nMil(totalDe(granTot))}</td>
    </tr></tfoot></table>
    <div style="${BASE} font-size:${px(10)}; color:#888; margin-top:${px(7)};">${dias.length} ${dias.length===1?'jornada':'jornadas'} · ${nMil(totalDe(granTot))} unidades</div>
  </div>`;
  return f;
};
const dibujarFoto = () => {
  document.getElementById('ctrl').innerHTML =
    [1,1.5,2].map(e => `<button data-e="${e}" class="${escala===e?'on':''}">${e===1?'Chico':e===1.5?'Mediano':'Grande'}</button>`).join('')
    + `<button data-x="1" style="margin-left:10px;">✕ Cerrar</button>`;
  document.getElementById('fotoCaja').innerHTML = fotoDe(escala);
  document.querySelectorAll('#ctrl button[data-e]').forEach(b => b.onclick = () => { escala = Number(b.dataset.e); dibujarFoto(); });
  document.querySelector('#ctrl button[data-x]').onclick = () => document.getElementById('capa').classList.remove('ver');
};
document.getElementById('btFoto').addEventListener('click', () => { dibujarFoto(); document.getElementById('capa').classList.add('ver'); });
document.getElementById('capa').addEventListener('click', e => { if (e.target.id === 'capa') e.target.classList.remove('ver'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('capa').classList.remove('ver'); });
