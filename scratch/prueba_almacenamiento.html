<meta charset="utf-8">
<title>Banco de pruebas · Almacenamiento del turno</title>
<!--
  Corre el CÁLCULO REAL de Almacenamiento -datosMarcas- contra los datos REALES
  del servidor, sin pasar por el tablero, que pide contraseña.

  Las tareas se piden con el motor de sincronización, no con un fetch: del
  servidor vienen COMPRIMIDAS y el motor las expande. Leer el JSON crudo sería
  probar con datos que la pantalla nunca ve.

  LO QUE VIGILA, desde el 12-ago-2026: que el BUFFER incluya las tareas que
  NADIE TRABAJÓ. Antes una tarea entraba solo si se trabajó o si seguía viva HOY,
  así que al mirar un día pasado lo no trabajado ya había vencido, no entraba, y
  el cuadro decía 100% todos los días. Peor: el número se pudría con las horas —a
  las 04:00 del 12 este mismo banco daba 25.024 de buffer, y a las 09:00 daba
  11.858, porque en el medio las 12 tareas pasaron a Vencida.
-->
<style>
  body { background:#0b0e15; color:#e8ecf4; font-family: ui-monospace, Consolas, monospace; margin:0; padding:16px; font-size:13px; }
  .bien { color:#34d399; } .mal { color:#f87171; } b { color:#00E5FF; font-weight:400; }
  pre { white-space:pre-wrap; line-height:1.6; }
</style>
<pre id="salida">cargando…</pre>

<script src="../js/env.js"></script>
<script type="module">
  const P = document.getElementById('salida');
  const decir = (t) => { P.innerHTML += t + '\n'; };
  let malas = 0;
  const check = (n, ok, d) => {
    decir((ok ? '<span class="bien">  OK   </span>' : '<span class="mal">  FALLA</span>') +
          '  ' + n + (d ? '  <span style="opacity:.6">→ ' + d + '</span>' : ''));
    if (!ok) malas++;
  };

  window.onerror = (m, f, l) => decir('<span class="mal">ERROR: ' + m + ' (' + f + ':' + l + ')</span>');

  P.innerHTML = '';
  try {
    const syncEngine = await import('../js/services_v245/sync_engine_v24_9.js');
    const { datosMarcas, armarTurnoDe } = await import('../js/reportes/marcas.js');

    decir('bajando tareas y trabajadores…');
    await syncEngine.pullGlobal(['almacenaje_tasks', 'workers'], true);
    const tareas = syncEngine.syncStore.almacenaje_tasks || [];
    const workers = syncEngine.syncStore.workers || [];
    decir('  tareas: <b>' + tareas.length.toLocaleString('es') + '</b>   trabajadores: <b>' + workers.length + '</b>');

    const art = (tareas[0] && tareas[0].items && tareas[0].items[0]) || null;
    decir('  los artículos llegan como: <b>' + (Array.isArray(art) ? 'ARREGLO (sin expandir)' : 'objeto (expandido)') + '</b>\n');

    const gt = (d) => datosMarcas(tareas, d, d, armarTurnoDe(workers)).granTotal;

    /* ── LA JORNADA DEL 11, la que destapó el problema ──────────────────────
       33 tareas: 21 finalizadas con 11.858 pares y 12 vencidas con 13.166 que
       nadie tocó. Comprobado aparte, contando las tareas del servidor. */
    const g = gt('2026-08-11');
    decir('<b>11-ago</b>   BUFFER ' + g.buffer.toLocaleString('es') +
          '   avance ' + g.total.toLocaleString('es') +
          '   pendiente ' + g.pendiente.toLocaleString('es') +
          '   <b>' + g.pct + '%</b>\n');

    /* El BUFFER del 11 son las 33 tareas de esa ola y no depende de qué copia de
       datos se esté mirando: beta y producción tienen las mismas. El AVANCE sí
       depende —beta tiene la copia de esta madrugada— así que se comprueban las
       propiedades, no la cifra. */
    check('el BUFFER incluye las que nadie trabajó', g.buffer === 25024, g.buffer.toLocaleString('es'));
    check('el porcentaje YA NO dice 100%', g.pct < 100, g.pct + '%');
    check('queda pendiente lo que no se trabajó', g.pendiente > 0, g.pendiente.toLocaleString('es'));
    check('el avance no puede pasar al buffer', g.total <= g.buffer,
          g.total.toLocaleString('es') + ' ≤ ' + g.buffer.toLocaleString('es'));
    check('el cuadro cierra: buffer − avance = pendiente', g.buffer - g.total === g.pendiente);

    const g02 = gt('2026-08-02');
    check('un día que sí se completó sigue en 100%', g02.pct === 100, g02.pct + '%');

    const rango = datosMarcas(tareas, '2026-08-10', '2026-08-11', armarTurnoDe(workers)).granTotal;
    check('un rango de dos días suma los dos',
          rango.buffer === gt('2026-08-10').buffer + g.buffer,
          rango.buffer.toLocaleString('es'));

    decir(malas ? '\n<span class="mal">FALLARON ' + malas + '</span>' : '\n<span class="bien">TODO BIEN</span>');
    window.__listo = true; window.__fallaron = malas;
  } catch (e) {
    decir('<span class="mal">Se cayó: ' + (e && e.message) + '</span>');
    decir((e && e.stack || '').split('\n').slice(0, 4).join('\n'));
    window.__listo = true; window.__fallaron = 1;
  }
</script>
