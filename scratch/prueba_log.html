<!doctype html>
<html data-tema="indigo">
<meta charset="utf-8">
<title>Configuración · Log — la pantalla de verdad</title>
<link rel="stylesheet" href="../css/temas.css">
<link rel="stylesheet" href="../css/main.css">
<style>
  body { margin:0; padding:18px; background:var(--bg-dark); color:var(--text-pale); font-family:var(--font-ui); }
  #aviso { margin-bottom:14px; padding:10px 14px; border-radius:9px; font-size:13px;
           background:rgba(var(--warning-rgb),0.12); border:1px solid rgba(var(--warning-rgb),0.35); color:var(--warning-soft); }
</style>

<!-- Monta la pantalla DE VERDAD -`montarEventos`- contra el backend local, sin tener que
     entrar con usuario y clave. -->
<div id="aviso">Pantalla real, leyendo del backend local (puerto 8097).</div>
<div id="app"></div>

<script type="module">
  import { montarEventos } from '../js/views/eventos.js';

  const API = 'http://127.0.0.1:8097/api/eventos';
  montarEventos(document.getElementById('app'), {
    traer: async ({ dias = 7, origen = '', tipo = '', q = '' } = {}) => {
      const p = new URLSearchParams({ dias: String(dias) });
      if (origen) p.set('origen', origen);
      if (tipo) p.set('tipo', tipo);
      if (q) p.set('q', q);
      const r = await fetch(`${API}?${p}&z=${Date.now()}`);
      const c = await r.json();
      return { eventos: c.eventos || [], total: c.total || 0 };
    },
    alertar: (t, m) => console.log('[aviso]', t, m)
  });
</script>
