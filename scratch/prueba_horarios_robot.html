<meta charset="utf-8">
<title>Banco de pruebas · horarios del robot</title>
<!--
  Prueba `robotsService` con los datos REALES del servidor, fuera del tablero
  -que pide contrasena-.

  Lo que hay que ver:
    1. que lo de fabrica sea lo que el servidor hace HOY (ancla 19:00 y 07:00
       lun-sab, stock :30, picking :50, reportes 08:00);
    2. que `leToca` diga que si a la hora justa y que no diez minutos despues;
    3. que guardar y volver a leer devuelva lo mismo -ida y vuelta al servidor-;
    4. que una configuracion rota no deje al robot sin horario.

  El guardado va contra el entorno de PRUEBAS: la cabecera X-Environment la
  agrega el interruptor de abajo.
-->
<style>
  body { background:#0b0e15; color:#e8ecf4; font-family: system-ui, "Segoe UI", sans-serif; margin:0; padding:0 0 3rem; }
  #panel { padding:12px 16px; background:#151a24; border-bottom:1px solid #242b3a;
           font-family: ui-monospace, Consolas, monospace; font-size:12px; white-space:pre-line; }
  .mal { color:#f87171; } .bien { color:#34d399; } .ojo { color:#fbbf24; }
  h3 { margin:1.4rem 16px 0.5rem; font-size:14px; color:#93c5fd; }
  table { border-collapse:collapse; margin:0 16px; font-size:12px; }
  td, th { border:1px solid #242b3a; padding:4px 8px; text-align:left; }
</style>
<div id="panel">cargando…</div>
<div id="salida"></div>

<script type="module">
  const errores = [];
  window.onerror = (m, f, l) => { errores.push(m + ' (' + f + ':' + l + ')'); pintar(); };
  window.addEventListener('unhandledrejection', e => { errores.push('promesa: ' + e.reason); pintar(); });

  const res = [];
  const check = (nombre, ok, detalle) => { res.push({ nombre, ok, detalle: detalle || '' }); pintar(); };
  const pintar = () => {
    const fallan = res.filter(r => !r.ok).length;
    document.getElementById('panel').innerHTML =
      (errores.length ? '<span class="mal">' + errores.length + ' ERROR(ES) DE JS: ' + errores.join(' · ') + '</span>\n'
                      : '<span class="bien">sin errores de js</span>\n') +
      (res.length ? res.map(r => (r.ok ? '<span class="bien">  OK  </span>' : '<span class="mal">FALLA </span>') + r.nombre + (r.detalle ? '  — ' + r.detalle : '')).join('\n') : '') +
      (res.length ? `\n\n<span class="${fallan ? 'mal' : 'bien'}">${fallan ? fallan + ' falla(s)' : 'todo bien'}</span>` : '');
  };

  const sello = String(Date.now());
  const R = await import('../js/services_v245/robotsService.js?v=' + sello);

  // 1. Lo de fabrica tiene que ser lo que el servidor hace hoy
  const def = R.robotsPorDefecto();
  check('ancla noche a las 19:00', def.ancla_noche.hora === '19:00', def.ancla_noche.hora);
  check('ancla mañana a las 07:00', def.ancla_manana.hora === '07:00', def.ancla_manana.hora);
  check('el ancla NO corre domingo', def.ancla_noche.dias.dom === false);
  check('stock por hora al minuto 30', def.stock_hora.minuto === 30);
  check('picking por hora al minuto 50', def.picking_hora.minuto === 50);
  check('el stock por hora SI corre domingo', def.stock_hora.dias.dom === true);

  // 2. La cuenta de si le toca
  const lunes = (h, m) => new Date(2026, 7, 17, h, m);
  const domingo = (h, m) => new Date(2026, 7, 16, h, m);
  check('le toca al ancla el lunes 19:00', R.leToca('ancla_noche', def, lunes(19, 0)) === true);
  check('NO le toca 10 min despues', R.leToca('ancla_noche', def, lunes(19, 10)) === false);
  check('NO le toca el domingo', R.leToca('ancla_noche', def, domingo(19, 0)) === false);

  // 3. Ida y vuelta contra el servidor de PRUEBAS
  const original = window.fetch;
  window.fetch = (u, o) => {
    o = o || {}; o.headers = new Headers(o.headers || {});
    o.headers.set('X-Environment', 'beta');
    return original(u, o);
  };
  try {
    const nueva = JSON.parse(JSON.stringify(def));
    nueva.ancla_noche.hora = '21:00';
    nueva.ancla_noche.dias.dom = true;
    nueva.stock_hora.cadaMin = 30;
    await R.guardarRobots(nueva);
    localStorage.removeItem('config_robots_v1');           // que no lea el cache
    const vuelta = await R.cargarRobots();
    check('guardar y releer: la hora vuelve 21:00', vuelta.ancla_noche.hora === '21:00', vuelta.ancla_noche.hora);
    check('guardar y releer: el domingo quedo prendido', vuelta.ancla_noche.dias.dom === true);
    check('guardar y releer: cada 30 minutos', vuelta.stock_hora.cadaMin === 30, String(vuelta.stock_hora.cadaMin));

    // y que no se haya llevado puesta la jornada, que comparte el cajon
    const r = await fetch('https://logistics-backend-wv0x.onrender.com/api/logistics/config?t=' + Date.now());
    const cajon = (await r.json()).data || {};
    check('la jornada sigue en su lugar', !!cajon.jornada, Object.keys(cajon).join(', '));
    check('las zonas siguen en su lugar', !!cajon.zonas);

    // se deja como estaba
    await R.guardarRobots(def);
    const limpio = await R.cargarRobots();
    check('se restauro lo de fabrica', limpio.ancla_noche.hora === '19:00' && limpio.ancla_noche.dias.dom === false);
  } catch (e) {
    check('ida y vuelta contra el servidor', false, String(e && e.message || e));
  }

  // 4. Basura adentro
  const roto = R.normalizar({ ancla_noche: { hora: '99:99' }, stock_hora: { cadaMin: 7, minuto: 300 } });
  check('una hora imposible cae a la de fabrica', roto.ancla_noche.hora === '19:00', roto.ancla_noche.hora);
  check('un "cada 7 minutos" cae a 60', roto.stock_hora.cadaMin === 60, String(roto.stock_hora.cadaMin));
  check('un minuto 300 cae a 30', roto.stock_hora.minuto === 30, String(roto.stock_hora.minuto));

  // Cuadro final de como quedaria
  const cfg = R.robotsPorDefecto();
  document.getElementById('salida').innerHTML = '<h3>Como corre cada tarea, con lo de fábrica</h3><table>' +
    '<tr><th>tarea</th><th>cuándo</th></tr>' +
    R.TAREAS.map(t => `<tr><td>${t.etiqueta}</td><td>${R.comoCorre(t.id, cfg)}</td></tr>`).join('') + '</table>';
</script>
