<!-- La cabecera ENTERA de los reportes en el tema Power BI.
     Saca del dashboard las cabeceras de verdad —las tres, tal cual estan escritas— y mide
     lo que el navegador termina aplicando. No es una copia: si el dashboard cambia, esto
     cambia con el. -->
<meta charset="utf-8">
<title>Prueba: la cabecera entera en azul</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/temas.css">
<link rel="stylesheet" href="../css/componentes.css">
<style>
  body{margin:0;padding:20px;background:var(--panel-deeper);font:13px/1.85 system-ui,sans-serif;color:var(--text-muted)}
  #eco{max-width:1050px;margin:0 auto 18px;white-space:pre-wrap}
  b{color:var(--success)} .mal{color:var(--danger);font-weight:700} .t{color:var(--brand-light);font-weight:700}
  #lienzo{max-width:1050px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
</style>
<div id="eco"></div>
<div id="lienzo"></div>
<script type="module">
const eco = (t) => document.getElementById('eco').innerHTML += t + '\n';
let fallas = 0, llegoAlFinal = false;
const ok = (n,c) => { eco((c?'<b>OK</b>  ':'<span class="mal">MAL</span> ')+n); if(!c) fallas++; };
window.addEventListener('error', e => { fallas++; eco('<span class="mal">SE CORTO</span> ' + e.message); });
setTimeout(() => { if (!llegoAlFinal) eco('\n<span class="mal">LA PRUEBA NO LLEGO AL FINAL.</span>'); }, 15000);

const CR = String.fromCharCode(13);
const src = (await (await fetch('../js/views/dashboard_v28.js?z='+Date.now())).text()).split(CR).join('');

/* Se saca cada cabecera del archivo, desde su <div class="caja-pbi"> hasta que cierra la
   franja. Las variables de plantilla se rellenan con algo cualquiera: lo que se mide es
   el color, no el dato. */
/* Se cuentan las etiquetas hasta que la franja cierra. Adivinar "el segundo </div>"
   cortaba la cabecera antes de las casillas de fecha, y la prueba daba por bueno un
   trozo que no era el que se ve en pantalla. */
const hastaQueCierre = (txt, desde) => {
  let i = desde, prof = 0;
  while (i < txt.length) {
    const abre = txt.indexOf('<div', i), cierra = txt.indexOf('</div>', i);
    if (cierra < 0) break;
    if (abre >= 0 && abre < cierra) { prof++; i = abre + 4; }
    else { prof--; i = cierra + 6; if (prof === 0) return i; }
  }
  return i;
};
/* El nombre del reporte aparece DOS veces: en un comentario del codigo y en su <h3>.
   Buscando el primero, el recorte arrancaba en la tarjeta anterior y salia un pedazo que
   no era. Se saltean las lineas que son comentario. */
const dondeEstaElTitulo = (marca) => {
  let i = -1;
  while ((i = src.indexOf(marca, i + 1)) >= 0) {
    const linea = src.slice(src.lastIndexOf('\n', i) + 1, src.indexOf('\n', i));
    if (!linea.includes('<!--')) return i;
  }
  return -1;
};
const cabecera = (marca) => {
  const i = dondeEstaElTitulo(marca);
  if (i < 0) throw new Error('no esta: ' + marca);
  const a = src.lastIndexOf('<div class="caja-pbi"', i);
  const tapa = src.indexOf('tapa-pbi', a);
  const fin = hastaQueCierre(src, src.lastIndexOf('<div', tapa));
  return src.slice(a, fin).replace(/\$\{[^{}]*\}/g, '26/08/2026') + '</div>';
};

const REPORTES = [
  ['REPORTE DE PRODUCCIÓN POR HORA', 'Producción por hora'],
  ['REPORTE DE ALMACENADO POR SEMANA Y MARCA', 'Almacenado por semana'],
  ['RENDIMIENTO DE OPERARIOS', 'Rendimiento de operarios']
];
document.getElementById('lienzo').innerHTML = REPORTES.map(([m]) => cabecera(m)).join('');
const cajas = [...document.querySelectorAll('#lienzo .caja-pbi')];
eco('Cabeceras sacadas del dashboard: <b>' + cajas.length + '</b> de 3\n');

const bg = (e) => e ? getComputedStyle(e).backgroundColor : 'no hay';
const fg = (e) => e ? getComputedStyle(e).color : 'no hay';
const lum = (c) => { const m = c.match(/\d+/g); return m ? 0.299*+m[0]+0.587*+m[1]+0.114*+m[2] : null; };
const pintar = (tema) => document.documentElement.setAttribute('data-tema', tema);

eco('<span class="t">── EN POWER BI, LA CABECERA ENTERA EN AZUL ──</span>');
pintar('pbi');
REPORTES.forEach(([, nombre], i) => {
  const caja = cajas[i], tapa = caja.querySelector('.tapa-pbi');
  ok(nombre + ': la franja va en el azul de la foto — ' + bg(tapa), bg(tapa) === 'rgb(18, 54, 92)');
  ok(nombre + ': el título en blanco', fg(caja.querySelector('h3')) === 'rgb(255, 255, 255)');
  const sub = [...tapa.querySelectorAll('div')].find(d => !d.querySelector('h3') && d.innerText.trim() && d !== tapa);
  ok(nombre + ': el subtítulo se lee sobre el azul', sub ? Math.abs(lum(fg(sub)) - lum('rgb(18,54,92)')) > 45 : true);
});

eco('\n<span class="t">── LAS FECHAS DEL RANGO, QUE NO SE VEÍAN ──</span>');
const conFechas = cajas.find(c => c.querySelector('input[type=date]'));
ok('hay un reporte con rango de fechas', !!conFechas);
if (conFechas) {
  const rotulos = [...conFechas.querySelectorAll('.tapa-pbi span')].filter(s => /DE:|HASTA:/.test(s.innerText));
  ok('los rótulos DE y HASTA salen en blanco: ' + rotulos.map(r => fg(r)).join(' / '),
     rotulos.length > 0 && rotulos.every(r => fg(r) === 'rgb(255, 255, 255)'));
  const casilla = conFechas.querySelector('input[type=date]');
  ok('la casilla de la fecha queda clara, para poder leer lo escrito: ' + bg(casilla), lum(bg(casilla)) > 200);
  ok('y su texto oscuro', lum(fg(casilla)) < 120);
}
ok('el botón HOY ya no está en ningún lado', !/>HOY</.test(src) && !/__hourlyHoy/.test(src));

eco('\n<span class="t">── TODO LO DE LA FRANJA SE LEE ──</span>');
const flojas = [];
cajas.forEach(c => [...c.querySelectorAll('.tapa-pbi *')].forEach(e => {
  if (!e.innerText || !e.innerText.trim() || e.children.length) return;
  let el = e, f = bg(e);
  while (f === 'rgba(0, 0, 0, 0)' && el.parentElement) { el = el.parentElement; f = bg(el); }
  const a = lum(fg(e)), b = lum(f);
  if (a !== null && b !== null && Math.abs(a-b) < 45) flojas.push(e.innerText.trim().slice(0,26));
}));
ok('ningún texto de la cabecera queda casi invisible' + (flojas.length ? ': ' + flojas.join(' · ') : ''), !flojas.length);

eco('\n<span class="t">── LOS OTROS TRES TEMAS NO SE MUEVEN ──</span>');
for (const tema of ['indigo','pbi-classic','negro']) {
  pintar(tema);
  ok(tema + ': la franja no se pone azul', cajas.every(c => bg(c.querySelector('.tapa-pbi')) !== 'rgb(18, 54, 92)'));
}
pintar('negro');
const invisiblesNegro = [];
cajas.forEach(c => [...c.querySelectorAll('h3')].forEach(e => {
  let el = e, f = bg(e);
  while (f === 'rgba(0, 0, 0, 0)' && el.parentElement) { el = el.parentElement; f = bg(el); }
  if (Math.abs(lum(fg(e)) - lum(f)) < 40) invisiblesNegro.push(e.innerText.trim());
}));
ok('en Negro los títulos siguen legibles' + (invisiblesNegro.length ? ': ' + invisiblesNegro.join(' · ') : ''), !invisiblesNegro.length);

pintar('pbi');
llegoAlFinal = true;
eco(fallas ? '\n<span class="mal">' + fallas + ' FALLARON</span>'
           : '\n<b>Las tres cabeceras quedan enteras en azul, y solo en Power BI.</b>');
</script>
