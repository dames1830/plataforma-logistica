:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--linea:rgba(255,255,255,.08);

.pes{display:flex;border-bottom:1px solid var(--linea)}

table{width:100%;border-collapse:collapse;font-size:13px}

td.izq{text-align:left;white-space:nowrap}
tr.p:hover{background:rgba(255,255,255,.03)}
.pct{font-weight:900;font-size:15px} .v{color:var(--verde)} .a{color:var(--ambar)} .r{color:var(--rojo)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;width:96px;margin:4px auto 0}
.bar i{display:block;height:100%;border-radius:3px}
.chip{font-size:10.5px;color:var(--txt3)} .socio{color:var(--txt2);font-size:12px}
.t2{color:var(--txt2);font-size:13px}
.t1x{font-weight:900;font-size:15px}
.filtro{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}
.filtro button{padding:6px 13px;border-radius:8px;border:1px solid var(--linea);background:rgba(255,255,255,.03);

.filtro button.on{background:rgba(88,166,255,.16);border-color:var(--acento);color:var(--txt)}
.filtro button .c{font-weight:900;opacity:.65;margin-left:5px}
.pos{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;

.tarj{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px}
.t1{background:var(--panel2);border:1px solid var(--linea);border-radius:9px;padding:11px 13px}

.t1 .d{font-size:11px;color:var(--txt2);margin-top:5px}

"22:08",300],["2026-08-25",["jcuevas","fpalacios"],648,100,140,"03:17","04:57",300],["2026-08-25",["jcuevas","jramos"],825,75,175,"22:27","00:32",300],["2026-08-25",["jcuevas","jramos"],743,64,159,"21:02","22:05",300],["2026-08-25",["jcuevas","jramos"],40,9,18,"22:06","22:15",300],["2026-08-25",["cmoreano","eleon"],396,10,89,"05:00","05:10",300],["2026-08-25",["cmoreano","eleon"],186,46,47,"04:04","04:50",300],["2026-08-25",["mbravo","jmaicelo"],1014,136,213,"20:24","22:40",300],["2026-08-25",["scasahuaman","pmurayari"],1041,120,218,"20:25","22:25",300],["2026-08-25",["jyauyo","galata"],438,71,98,"20:26","21:37",300],["2026-08-25",["achaqquere","rmu\u00f1oz"],320,66,74,"22:39","00:35",300],["2026-08-25",["jyauyo","galata"],361,71,82,"22:46","00:47",300],["2026-08-25",["jyauyo","galata"],430,64,96,"00:47","01:51",300],["2026-08-25",["achaqquere","rmu\u00f1oz"],430,86,96,"01:04","02:30",300],["2026-08-25",["pmurayari","drodriguez"],792,178,168,"03:34","06:33",300],["2026-08-25",["cmoreano","eleon"],450,136,100,"01:46","04:02",300],["2026-08-25",["jyauyo","galata"],570,107,124,"01:54","03:41",300],["2026-08-25",["cmoreano","eleon"],400,80,90,"00:00","01:20",300],["2026-08-25",["achaqquere","rmu\u00f1oz"],447,42,99,"04:48","05:30",300],["2026-08-25",["achaqquere","rmu\u00f1oz"],470,90,104,"03:18","04:47",300],["2026-08-25",["jyauyo","galata"],350,64,80,"21:41","22:45",300],["2026-08-25",["cmoreano","eleon"],332,78,76,"04:47","06:05",300],["2026-08-25",["scasahuaman","rrivera"],32,16,16,"05:52","06:08",300],["2026-08-26",["jcuevas","cmoreano"],478,28,106,"00:10","00:37",300],["2026-08-26",["jcuevas","cmoreano"],206,26,51,"22:30","22:56",300],["2026-08-26",["mbravo","jmaicelo"],1006,150,211,"20:20","22:50",300],["2026-08-26",["jbarazorda","mzarzosa"],1250,69,260,"21:46","22:55",300],["2026-08-26",["jbarazorda","mzarzosa"],1926,80,395,"20:24","21:45",300],["2026-08-26",["jbarazorda","mzarzosa"],508,25,112,"22:33","22:58",300],["2026-08-26",["mbravo","jmaicelo"],409,58,92," const M = h => +h.slice(0,2)*60 + +h.slice(3);
const nm = n => Math.round(n).toLocaleString('es-PE');
/* Los tiempos se escriben como los lee una persona: "48 min", "2 h 15 min".
   Daniel, 27-ago-2026: *"necesito saber en cuantos minutos lo hizo"*. */
const hm = m => {
  m = Math.round(m);
  if (m < 60) return m + ' min';
  const h = Math.floor(m/60), r = m % 60;
  return h + ' h' + (r ? ' ' + String(r).padStart(2,'0') + ' min' : '');
};
const cl = p => p >= 100 ? 'v' : p >= 85 ? 'a' : 'r';
const col = p => p >= 100 ? 'var(--verde)' : p >= 85 ? 'var(--ambar)' : 'var(--rojo)';
/* EL CORAZON DEL CUADRO ES SABER QUIEN ES MAS EFICIENTE.
   Daniel, 27-ago-2026: *"quiero que me filtres por las personas que fueron mas eficientes;
   ese es el corazon de este cuadro"*. El corte NO es 100%: el almacen entero corre por
   encima de eso, asi que 100% no separa a nadie. Se compara contra el rendimiento general
   del rango elegido —el que sale en la primera tarjeta—, que es la vara de la casa. */
let VISTA = 'todos';
const TOPE = 400;   // por encima de esto la tarea no se hizo de verdad en ese tiempo
const BASE = 10;    // ninguna tarea puede pedir menos: ir al buffer, ubicar y volver ya toma eso

/* EL TIEMPO PERMITIDO DE UNA TAREA.
   Daniel, 27-ago-2026: *"la hora de produccion tiene que ser trescientos pares; dentro de
   esos sesenta minutos tiene que estar metido esos diez minutos de tarea base"*.
   O sea: los 10 minutos son un PISO, no una suma. Una tarea de 300 pares es de 60 minutos,
   no de 70. El piso solo entra cuando la cantidad es tan chica que el puro traslado ya se
   la come —una tarea de 5 pares pediria 1 minuto y nadie la cumpliria nunca—. */
const permitido = (pares, meta) => Math.max(BASE, pares / meta * 60);

const d1El = document.getElementById('d1'), d2El = document.getElementById('d2');
const tarj = document.getElementById('tarj'), nota = document.getElementById('nota');
const cuerpo = document.getElementById('cuerpo'), pie = document.getElementById('pie'), cuenta = document.getElementById('cuenta');
const filtro = document.getElementById('filtro');
window.__verEf = (v) => { VISTA = v; pintar(); };

function pintar(){
  const d1 = d1El.value, d2 = d2El.value;
  const R = T.filter(r => r[0] >= d1 && r[0] <= d2);
  const per = {}, dias = {};
  let fuera = 0, espT = 0, minT = 0, okT = 0, nT = 0, qT = 0, qFuera = 0;

  R.forEach(([f, us, q, min, _viejo, s, e, meta]) => {
    const esp = permitido(q, meta);
    const pct = esp / min * 100;
    if (pct > TOPE) { fuera++; qFuera += q; return; }
    espT += esp; minT += min; nT++; qT += q; if (min <= esp) okT++;
    let a = M(s), b = M(e); if (b < a) b += 1440;
    // Los pares se parten con la MISMA regla de la pestana Personas: el par de mas
    // va al primero. Con la mitad exacta la suma de las filas no cerraba con el total.
    const base = Math.floor(q / us.length), resto = q % us.length;
    us.forEach((u, i) => {
      const p = per[u] || (per[u] = {esp:0, min:0, q:0, n:0, ok:0, soc:{}});
      p.esp += esp; p.min += min; p.q += base + (i < resto ? 1 : 0); p.n++; if (min <= esp) p.ok++;
      us.forEach(o => { if (o !== u) p.soc[o] = (p.soc[o]||0) + 1; });
      (dias[u+'|'+f] || (dias[u+'|'+f] = [])).push([a, b]);
    });
  });

  // Aprovechamiento: se unen los tramos que se pisan, para que nunca pase del 100%.
  const apr = {};
  Object.entries(dias).forEach(([k, tr]) => {
    const u = k.split('|')[0];
    tr.sort((x,y) => x[0]-y[0]);
    const un = [];
    tr.forEach(([a,b]) => {
      if (un.length && a <= un[un.length-1][1]) un[un.length-1][1] = Math.max(un[un.length-1][1], b);
      else un.push([a,b]);
    });
    const trabajando = un.reduce((s,[a,b]) => s+b-a, 0);
    const turno = Math.max(...tr.map(t=>t[1])) - Math.min(...tr.map(t=>t[0]));
    const p = apr[u] || (apr[u] = {t:0, l:0, d:0});
    p.t += trabajando; p.l += turno; p.d++;
  });

  const gen = minT ? espT/minT*100 : 0;
  tarj.innerHTML = [
    ['Rendimiento general', nm(gen)+'%', col(gen), nm(espT/60)+' h permitidas contra '+nm(minT/60)+' h reales'],
    ['Tareas dentro del tiempo', okT+' de '+nT, (okT/nT*100 >= 85 ? 'var(--verde)' : 'var(--ambar)'), nm(nT?okT/nT*100:0)+'% de las tareas'],
    ['Personas medidas', Object.keys(per).length, 'var(--acento)', 'en '+new Set(R.map(r=>r[0])).size+(new Set(R.map(r=>r[0])).size===1?' jornada':' jornadas')],
    ['Pares almacenados', nm(qT), 'var(--acento)', (qFuera ? nm(qFuera)+' mas quedaron fuera de la medicion' : 'en el rango elegido')]
  ].map(([l,n,c,d]) => '<div class="t1"><div class="n" style="color:'+c+'">'+n+'</div><div class="l">'+l+'</div><div class="d">'+d+'</div></div>').join('');

  nota.innerHTML = '<b>100% = terminó justo en el tiempo permitido.</b> La hora de producción es de <b>300 pares el grupo</b> —600 o 1.000 en ropa y otros—, así que una tarea de 300 pares es de <b>60 minutos</b>: hacerla en 40 da <b>150%</b>. Los 10 minutos de recorrido ya van metidos dentro de esa hora; solo se aplican como <b>mínimo</b>, para que una tarea de 5 pares no pida 1 minuto y nadie la pueda cumplir nunca.';

  const todas = Object.entries(per).sort((a,b) => b[1].esp/b[1].min - a[1].esp/a[1].min);
  const pctDe = (p) => p.esp/p.min*100;
  const sobre = todas.filter(([,p]) => pctDe(p) > gen).length;
  const bajo  = todas.filter(([,p]) => pctDe(p) < 100).length;
  filtro.innerHTML = [
    ['todos',   'Todos',                              todas.length],
    ['mejores', 'Los más eficientes',                 sobre],
    ['flojos',  'Los que no cumplen la hora',         bajo]
  ].map(([id, et, n]) => '<button class="'+(VISTA===id?'on':'')+'" data-v="'+id+'">'
      + et + '<span class="c">' + n + '</span></button>').join('')
    + '<span style="align-self:center;margin-left:6px;font-size:11.5px;color:var(--txt3)">'
    + (VISTA==='mejores' ? 'la vara es el '+nm(gen)+'% general del rango'
     : VISTA==='flojos'  ? 'tardaron mas de lo permitido'
     : 'ordenados de mas a menos eficiente') + '</span>';

  filtro.querySelectorAll('button[data-v]').forEach(b =>
      b.addEventListener('click', () => { VISTA = b.dataset.v; pintar(); }));

  const filas = VISTA === 'mejores' ? todas.filter(([,p]) => pctDe(p) > gen)
              : VISTA === 'flojos'  ? todas.filter(([,p]) => pctDe(p) < 100)
              : todas;
  /* La medalla va SOLO al primero del cuadro. Con un corte fijo se la llevaba medio
     almacen —el promedio ya esta en 137%— y dejaba de significar nada. */
  const puesto = new Map(todas.map(([u], i) => [u, i + 1]));
  cuerpo.innerHTML = filas.map(([u,p]) => {
    const pct = p.esp/p.min*100;
    const dif = p.esp - p.min;              // minutos de mas o de menos contra lo permitido
    const soc = Object.entries(p.soc).sort((x,y) => y[1]-x[1]).slice(0,2);
    const n = puesto.get(u);
    const medalla = (n === 1 && pct > 100) ? ' <span class="med">el m&aacute;s eficiente</span>' : '';
    return '<tr class="p"><td class="izq">'
      + '<span class="pos'+(n<=3?' o'+n:'')+'">'+n+'</span><b>'+u+'</b>'+medalla
      +   '</td>'
      + '<td><b>'+nm(p.q)+'</b></td>'
      + '<td class="t2">'+hm(p.esp)+'</td>'
      + '<td class="t1x '+cl(pct)+'">'+hm(p.min)+'</td>'
      + '<td class="'+(dif >= 0 ? 'v' : 'r')+'" style="font-weight:800">'
      +   (dif >= 0 ? '&minus; ' + hm(dif) : '+ ' + hm(-dif))
      +   '<div class="chip">'+(dif >= 0 ? 'termin&oacute; antes' : 'se pas&oacute;')+'</div></td>'
      + '<td><span class="pct '+cl(pct)+'">'+nm(pct)+'%</span>'
      +   '<div class="bar"><i style="width:'+Math.min(100, pct/2.5)+'%;background:'+col(pct)+'"></i></div></td>'
      + '<td>'+p.ok+' <span class="chip">de '+p.n+'</span></td>'
      + '<td class="izq socio">'+(soc.map(([o,c]) => o+' <span class="chip">x'+c+'</span>').join(' &middot; ') || '&ndash;')+'</td></tr>';
  }).join('');

  cuenta.textContent = R.length + ' tareas en el rango';
  pie.innerHTML = '<b>Se apartaron '+fuera+' de '+R.length+' tareas ('+nm(qFuera)+' pares)</b> porque dan un número imposible: se cerraron todas juntas al final '
    + '—por ejemplo 13.800 pares en 5 minutos—. No se promedian, para que no le inflen el número a nadie.<br>'
    + '<b>La eficiencia de una persona es la de los grupos en que trabajó:</b> a dos que hicieron la misma tarea juntos no hay forma de separarlos. '
    + 'Los pares sí se parten a la mitad; las horas no, porque los dos estuvieron ahí todo el tiempo.<br>'
    + '<b>Debía tomarle</b> son los pares divididos entre la meta de su categoría, con un mínimo de 10 minutos. <b>Le tomó</b> es el tiempo real, de que agarró la tarea a que la cerró, descontando la cena de 23:00 a 23:50.';
}
d1El.onchange = d2El.onchange = pintar;
pintar();
</script></body></html>
