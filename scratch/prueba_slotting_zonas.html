<!doctype html>
<html data-tema="indigo">
<meta charset="utf-8">
<title>Slotting · Tareas Día — el selector de zonas</title>
<link rel="stylesheet" href="../css/temas.css">
<link rel="stylesheet" href="../css/main.css">
<style>
  body { margin:0; padding:18px; background:var(--bg-dark); color:var(--text-pale); font-family:var(--font-ui); }
  #aviso { margin-bottom:14px; padding:10px 14px; border-radius:9px; font-size:13px;
           background:rgba(var(--warning-rgb),0.12); border:1px solid rgba(var(--warning-rgb),0.35); color:var(--warning-soft); }
  #eco { margin-top:14px; padding:10px 14px; border-radius:9px; font-family:ui-monospace,monospace; font-size:12px;
         background:rgba(var(--ink-rgb),0.05); border:1px solid var(--border); color:var(--text-pale); white-space:pre-wrap; }
</style>

<!-- Monta la pantalla DE VERDAD -`montarSlotting`, vista tareas_dia- para ver el selector
     de zonas sin tener que entrar con usuario y clave. PROCESAR no procesa: escribe abajo
     con que zonas se habria llamado. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<div id="aviso">Pantalla real. <b>PROCESAR SLOTTING</b> no procesa nada: escribe abajo las zonas que habría mandado.</div>
<div id="app"></div>
<div id="eco">— todavía no se apretó PROCESAR —</div>

<script type="module">
  const HOY = new Date().toISOString().slice(0, 10);
  import { montarSlotting } from '../js/views/slotting.js';
  import * as slottingService from '../js/services_v245/slottingService.js';

  const dibujar = () => montarSlotting(document.getElementById('app'), {
    vista: 'tareas_dia',
    svc: slottingService,
    cajon: { [HOY]: { fecha: HOY, zona: 'MZN02', generado: HOY + ' 20:10', cuerpos: 4, pares: 690, tareas: [
      { n: 1, pares: 272, marca: 'North Star', status: 'Creada', prioridad: true,
        lineas: [{ ubi: 'MZN02-07-05', sku7: '8811905', pares: 150, marca: 'North Star', temporada: 'T. Actual',
                   llevarA: 'MZN02-01-03', motivo: 'le toca anterior',
                   detalle: [{ubi:'MZN02-07-05-A-01',skuFull:'8811905-1-38',talla:'38',pares:90},{ubi:'MZN02-07-05-B-01',skuFull:'8811905-1-39',talla:'39',pares:60}] },
                 { ubi: 'MZN02-11-02', sku7: '5566814', pares: 122, marca: 'North Star', temporada: 'T. Actual',
                   llevarA: 'MZN02-04-07', motivo: 'es saldoGrande', detalle: [] }] },
      { n: 2, pares: 143, marca: 'North Star', status: 'Asignado', u1: 'kcasahuaman', inicio: '21:10',
        lineas: [{ ubi: 'MZN02-15-09', sku7: '7613738', pares: 143, marca: 'North Star', temporada: 'T. Anterior',
                   llevarA: 'MZN02-01-11', motivo: 'le toca anterior', detalle: [] }] },
      { n: 3, pares: 200, marca: 'North Star', status: 'Finalizado', u1: 'saltamirano', inicio: '20:30', termino: '21:05',
        lineas: [{ ubi: 'MZN02-19-04', sku7: '8814964', pares: 200, marca: 'North Star', temporada: 'T. Actual',
                   llevarA: 'MZN02-04-02', motivo: 'es saldoGrande', detalle: [] }] },
      { n: 4, pares: 75, marca: 'North Star', status: 'Creada',
        lineas: [{ ubi: 'MZN02-23-08', sku7: '2891507', pares: 75, marca: 'North Star', temporada: 'T. Actual',
                   llevarA: 'MZN02-04-05', motivo: 'es saldoGrande', detalle: [] }] }
    ] } },
    operarios: [
      { usuario: 'acespedes',   nombre: 'ANGELA MILAGROS', turno: 'DÍA' },
      { usuario: 'jmaicelo',    nombre: 'JUAN',            turno: 'NOCHE' },
      { usuario: 'kcasahuaman', nombre: 'KEVIN',           turno: 'NOCHE' },
      { usuario: 'mtorres',     nombre: 'MARIA',           turno: 'DÍA' }
    ],
    jornadaHoy: HOY,
    jornadaVencida: () => false,
    alertar: (t, m) => { window.__ultimoAviso = t + ' :: ' + String(m).replace(/<[^>]+>/g,''); console.log('[aviso]', t, m); },
    alGuardar: async () => true,
    alExportar: async (P) => {
      window.__ultimoPaquete = P;
      document.getElementById('eco').textContent =
        'alExportar recibio: ' + JSON.stringify(P, null, 2).slice(0, 900) + ' ...';
    },
    alProcesar: async (zonas) => {
      document.getElementById('eco').textContent =
        'barrerParaSlotting se habría llamado con:\n' + JSON.stringify(zonas, null, 2);
      return null;
    }
  });

  dibujar();
  slottingService.cargarConfig()
    .then(() => { console.log('config publicada:', JSON.stringify(slottingService.configActual().zonas)); dibujar(); })
    .catch(e => console.warn('[prueba] sin config publicada:', e && e.message));
</script>
