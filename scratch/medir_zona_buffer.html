<!doctype html><html><head><meta charset="utf-8"><title>Zona Buffer: cuanto tarda</title>
<style>body{font:14px system-ui;padding:20px;background:#0f172a;color:#e2e8f0}
pre{background:#1e293b;padding:14px;border-radius:8px;line-height:1.6}</style></head>
<body><h3>Zona Buffer — las mismas llamadas que hace la pantalla</h3><pre id="s">midiendo...</pre>
<script type="module">
const AREAS = ['buffer_activo','buffer_reserva','buffer','solicitud','articulos',
               'tallas','validar_activo','validar_reserva','validar_lpn'];
const log = []; const pinta = () => document.getElementById('s').textContent = log.join('\n');
const M = await import('../js/services_v245/csvHub_v6.js');

const vuelta = async (titulo) => {
  // se vacia la memoria RAM del modulo, como cuando se recarga la pagina
  AREAS.forEach(a => { M.dataStore[a] = null; });
  ['almacenaje_activo','analisis_sku_reserva'].forEach(a => { M.dataStore[a] = null; });
  log.push(''); log.push(titulo); pinta();
  const T = performance.now();
  for (const a of AREAS) {
    const t = performance.now();
    let r = null; try { r = await M.getAreaData(a); } catch (e) {}
    const ms = Math.round(performance.now() - t);
    if (ms > 40) log.push(`   ${a.padEnd(20)} ${String(ms).padStart(6)} ms  ${Array.isArray(r) ? r.length + ' filas' : ''}`);
  }
  const tot = Math.round(performance.now() - T);
  log.push(`   ${'TOTAL'.padEnd(20)} ${String(tot).padStart(6)} ms`); pinta();
  return tot;
};

const a = await vuelta('PRIMERA VEZ (esta PC no tiene nada guardado)');
const b = await vuelta('SEGUNDA VEZ (ya lo tiene, y el robot no publico nada nuevo)');
log.push(''); log.push(`   ==> de ${(a/1000).toFixed(1)} s a ${(b/1000).toFixed(1)} s`);
pinta();
</script></body></html>
