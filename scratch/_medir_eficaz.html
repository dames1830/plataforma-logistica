<!-- ¿Existe "eficaz sin ser eficiente"? Es decir: ¿hay tareas que se cierran sin
     haber movido todo lo que mandaban? Si todas se completan al 100%, esa mitad
     no aporta nada y la efectividad es solo el ritmo. -->
<meta charset="utf-8"><title>Medir eficacia</title>
<style>body{background:#0d1117;color:#8b949e;font:12.5px/1.7 ui-monospace,monospace;padding:20px;white-space:pre}
b{color:#3fb950}.t{color:#58a6ff;font-weight:700}.r{color:#f85149}</style>
<div id="o"></div>
<script type="module">
const o = t => document.getElementById('o').innerHTML += t + '\n';
const CR = String.fromCharCode(13);
const leer = async f => (await (await fetch(f+'?z='+Date.now())).text()).split(CR).join('');
const tz = (s,a,b) => { const i=s.indexOf(a); return s.slice(i, s.indexOf(b,i)); };
const DB = await leer('../js/views/dashboard_v28.js');
const SY = await leer('../js/services_v245/sync_engine_v24_9.js');
const MET_URL = '../js/services_v245/metasService.js?z=' + Date.now();
const metas = await import(MET_URL);
await metas.cargarReglas(true);

const M = await import('data:text/javascript,' + encodeURIComponent(`
import * as metasService from '${new URL(MET_URL, location.href).href}';
const indexarMaestro = () => ({ porSku: new Map(), familias: [], detalles: [], padres: {} });
const marcaNormalizada = m => m || 'S/M';
const diaOperativoDeTarea = t => t.fecha || String(t.inicio||'').slice(0,10);
` + tz(DB,'const getTaskTotalAvance = (t) => {','/* ── EL MAESTRO DE ARTÍCULOS')
  + tz(DB,'const getTaskMinutos = (t) => {','\n/**')
  + tz(DB,'const buildKpiDataset = (tasks, desde, hasta) => {','\n/** hh:mm a partir de minutos')
  + tz(SY,'function descomprimirTareas(data) {','\n/**')
  + '\nexport { buildKpiDataset, descomprimirTareas, getTaskMinutos, minutosPermitidos, getTaskMeta, getTaskTotalAvance };'));

const T = M.descomprimirTareas((await (await fetch('https://logistics-backend-wv0x.onrender.com/api/logistics/almacenaje_tasks')).json()).data);
const ago = T.filter(t => t.status === 'Finalizado' && t.inicio && t.termino && (t.fecha||'') >= '2026-08-01');
o('Tareas finalizadas de agosto: <b>' + ago.length + '</b>\n');

// Lo que la tarea MANDABA mover contra lo que de verdad se movio
let iguales = 0, cortas = 0, largas = 0, mandado = 0, hecho = 0;
const casos = [];
ago.forEach(t => {
  let man = 0, hec = 0;
  (t.items||[]).forEach(a => (a.items||[]).forEach(i => {
    const u = String(i.ubi||'').toUpperCase().trim();
    if (!u.startsWith('CDBUFFER') || u.startsWith('CDBUFFER-C')) return;
    man += parseFloat(i.qty) || 0;
    hec += (i.avance !== undefined && i.avance !== null) ? (parseFloat(i.avance)||0) : (parseFloat(i.qty)||0);
  }));
  if (man <= 0) return;
  mandado += man; hecho += hec;
  const d = hec - man;
  if (Math.abs(d) < 1) iguales++; else if (d < 0) { cortas++; casos.push([t.id, man, hec, hec/man*100]); }
  else largas++;
});
o('<span class="t">¿SE TERMINA LO QUE LA TAREA MANDA?</span>');
o('   se movio exactamente lo mandado : <b>' + iguales + '</b>');
o('   se movio MENOS                  : <span class="r">' + cortas + '</span>');
o('   se movio mas                    : ' + largas);
o('   en total: ' + Math.round(hecho).toLocaleString('es-PE') + ' de ' + Math.round(mandado).toLocaleString('es-PE')
  + ' pares  (' + (hecho/mandado*100).toFixed(1) + '%)');
if (casos.length) {
  o('\n   las que quedaron cortas:');
  casos.sort((a,b)=>a[3]-b[3]).slice(0,8).forEach(c =>
    o('      ' + c[0].padEnd(22) + String(Math.round(c[1])).padStart(7) + ' mandados ->'
      + String(Math.round(c[2])).padStart(7) + ' hechos  (' + Math.round(c[3]) + '%)'));
}

o('\n<span class="t">SI LA EFECTIVIDAD ES SOLO EL RITMO, ¿COMO QUEDA LA GENTE?</span>');
const filas = M.buildKpiDataset(T, '2026-08-01', '2026-08-26');
const per = {};
filas.forEach(r => {
  if (!r.mins || !r.usuarios.length || r.pct > 400) return;
  const q = Math.round(r.qty); if (q <= 0) return;
  const base = Math.floor(q/r.usuarios.length), resto = q % r.usuarios.length;
  r.usuarios.forEach((u,i) => {
    const d = per[u] || (per[u] = {esp:0,min:0,q:0,n:0,ok:0});
    d.esp += r.minutosEsperados; d.min += r.mins; d.q += base + (i<resto?1:0);
    d.n++; if (r.ok) d.ok++;
  });
});
const L = Object.entries(per).map(([u,d]) => ({u, pct:d.esp/d.min*100, ...d})).sort((a,b)=>b.pct-a.pct);
const efe = L.filter(x => x.pct >= 100);
o('   EFECTIVOS (100% o mas): <b>' + efe.length + '</b> de ' + L.length);
o('   NO EFECTIVOS          : ' + (L.length - efe.length));
o('\n   ' + 'PERSONA'.padEnd(15) + 'PARES'.padStart(9) + 'DEBIA'.padStart(10) + 'LE TOMO'.padStart(10) + '%'.padStart(7) + '  TAREAS A TIEMPO');
L.forEach(x => o('   ' + x.u.padEnd(15) + Math.round(x.q).toLocaleString('es-PE').padStart(9)
  + (Math.round(x.esp/60)+' h').padStart(10) + (Math.round(x.min/60)+' h').padStart(10)
  + (Math.round(x.pct)+'%').padStart(7) + ('  ' + x.ok + ' de ' + x.n).padEnd(12)
  + (x.pct>=100 ? '  <b>EFECTIVO</b>' : '  <span class="r">no efectivo</span>')));
</script>
