<!doctype html>
<html lang="es" data-tema="indigo">
<head>
<meta charset="utf-8">
<title>Prueba del chat interno</title>
<!-- El mismo <link> que index.html: es donde el chat escribe el iconito con el numero. -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/temas.css">
<link rel="stylesheet" href="../css/componentes.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  body { background: var(--bg-dark); color: var(--text-main); padding: 18px; min-height: 100vh; }
  h3 { margin: 0 0 .6rem; font-size: var(--t-lg); }
  pre { font-size: 13px; white-space: pre-wrap; line-height: 1.6; }
  .ok { color: var(--success-mid); } .falla { color: var(--danger-soft); }
  .aviso { color: var(--warning-soft); font-size: var(--t-sm); }
</style>
</head>
<body>
  <h3>Prueba del chat interno · se usa el archivo real js/chat.js contra la base de PRUEBAS (beta)</h3>
  <p class="aviso">Nada de esto toca producción: env.js sella todas las llamadas con X-Environment: beta porque esto corre en localhost.</p>
  <pre id="salida">corriendo…</pre>

  <script src="../js/env.js"></script>
  <script type="module">
    const salida = document.getElementById('salida');
    const res = [];
    let pintar = () => {};
    /* Mientras se mide el nombre de la pestaña, la prueba no lo toca: si no, se lee el
       suyo -'FALLAS 1'- en vez del que pone el chat. */
    let tocarTitulo = true;
    const chk = (cond, msg) => { res.push((cond ? 'OK    ' : 'FALLA ') + msg); pintar(); return !!cond; };
    const esperar = (ms) => new Promise(r => setTimeout(r, ms));

    /* Lo que la prueba creo en beta, la prueba lo deja como estaba. */
    const creadoPorLaPrueba = [];
    const limpiarLoDeLaPrueba = async () => {
      const API_L = 'https://logistics-backend-wv0x.onrender.com/api/logistics';
      for (const id of creadoPorLaPrueba) {
        try {
          await fetch(API_L + '/chat_' + id + '?date=MASTER',
                      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '[]' });
        } catch (e) { /* si no se puede, se limpia a mano */ }
      }
      try {
        const r = await fetch(API_L + '/chat_salas?date=MASTER&t=' + Date.now());
        const j = await r.json();
        const d = (j && j.data) || [];
        const quedan = d.filter(x => creadoPorLaPrueba.indexOf(x && x.id) < 0);
        if (quedan.length !== d.length) {
          await fetch(API_L + '/chat_salas?date=MASTER',
                      { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(quedan) });
        }
      } catch (e) { /* idem */ }
    };
    pintar = () => {
      const fallas = res.filter(r => r.indexOf('FALLA') === 0).length;
      salida.innerHTML = res.join(String.fromCharCode(10)) + String.fromCharCode(10) + String.fromCharCode(10)
        + (fallas ? '<span class="falla">HAY ' + fallas + ' FALLA(S)</span>'
                  : '<span class="ok">TODO BIEN (' + res.length + ' de ' + res.length + ')</span>');
      if (tocarTitulo) document.title = fallas ? 'FALLAS ' + fallas : 'TODO BIEN ' + res.length;
    };

    // Sesión de mentira: la prueba corre como dames, que es el administrador.
    localStorage.setItem('logistics_session', JSON.stringify({ username: 'dames', role: 'admin' }));

    const API = 'https://logistics-backend-wv0x.onrender.com/api/logistics';
    const OTRO = 'cascencio';

    try {
      const mod = await import('../js/chat.js?prueba=' + Date.now());
      await mod.montarChat({ username: 'dames', role: 'admin' });
      const chat = window.__chat;

      const burbujaSola = document.getElementById('chat-burbuja');
      chk(!!burbujaSola, 'la burbuja del chat esta en la esquina de abajo a la derecha');
      chk(getComputedStyle(burbujaSola).right === '20px',
          'y esta sola: el foquito del servidor subio a la barra de arriba');
      chk(!!document.getElementById('chat-panel'), 'el panel existe, cerrado');
      const seVe = (id) => getComputedStyle(document.getElementById(id)).display !== 'none';
      const chat0 = window.__chat;
      chk(document.getElementById('chat-panel').hidden === true, 'el panel arranca cerrado');
      chk(!seVe('chat-panel') && !seVe('chat-grupo') && !seVe('chat-toast'),
          'y cerrado quiere decir que NO SE VE: ni el panel, ni la ventana de grupo, ni el globito');
      const pendientesAlEntrar = chat0.estado().sinLeer;
      chk(pendientesAlEntrar > 0 ? seVe('chat-globo') : !seVe('chat-globo'),
          pendientesAlEntrar > 0
            ? 'al entrar ya habia ' + pendientesAlEntrar + ' sin leer y el contador se ve'
            : 'sin mensajes nuevos, el contador rojo no se ve (ni con un cero)');

      // 1. abrir una conversación con alguien con quien nunca se hablo
      const idSala = await chat.crearDirecta(OTRO);
      chk(/^du_/.test(idSala) && idSala.indexOf(OTRO) >= 0, 'la conversación de dos se crea con un id que sale de los dos nombres: ' + idSala);

      // 2. mandar un mensaje y comprobar que quedó en el servidor
      const texto = 'prueba automática ' + new Date().toLocaleTimeString('es-PE');
      await chat.mandar(idSala, texto);
      await esperar(600);
      const enServidor = await (await fetch(API + '/chat_' + idSala + '?date=MASTER&t=' + Date.now())).json();
      const lista = (enServidor && enServidor.data) || [];
      chk(lista.some(m => m.texto === texto && m.de === 'dames'), 'el mensaje llegó al servidor con su autor y su hora');
      chk(lista.every(m => m.id && m.cuando && m.cuando.indexOf('Z') < 0), 'los mensajes van con id propio y hora local, sin Z');

      // 2b. LA MEDIANOCHE NO SE LLEVA LA CONVERSACION
      //     El servidor guarda una foto por dia y devuelve la mas reciente; si el mensaje
      //     cayera en la foto de hoy, manana la conversacion arrancaria vacia y a los dos
      //     dias se perderia de verdad. Tiene que estar en MASTER y NO en la foto del dia.
      const hoyAqui = new Date().toLocaleString('sv').slice(0, 10);
      const fotoDelDia = await (await fetch(API + '/chat_' + idSala + '?date=' + hoyAqui + '&t=' + Date.now())).json();
      const enElDia = ((fotoDelDia && fotoDelDia.data) || []);
      chk(!enElDia.some(m => m.texto === texto),
          'el mensaje NO quedo en la foto del dia: la medianoche no se lleva la conversacion');

      /* LA PESTAÑA SE FINGE A MANO, y no se confía en la de verdad.
         El panel del navegador que corre esta prueba deja la pestaña ATRÁS, así que
         `visibilityState` sale 'hidden' y el caso "estoy mirando la web" no se probaría nunca.
         Es la misma trampa que ya mordió una vez, cuando el latido se apagaba en segundo plano. */
      const fingirPestana = (valor) => {
        Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => valor });
        Object.defineProperty(document, 'hidden', { configurable: true, get: () => valor !== 'visible' });
      };

      // 3. que llegue uno de la otra persona: se escribe directo al área, como si fuera su PC
      // la hora va LOCAL, que es como la escribe la otra PC (nunca toISOString)
      // ESTANDO EN OTRA COSA: no se abre nada, sube el contador y sale el globito de aviso.
      fingirPestana('hidden');
      tocarTitulo = false;              // de aca hasta que se mida, el titulo es del chat
      const suyo = { id: 'pru_' + Date.now().toString(36), de: OTRO,
                     cuando: new Date().toLocaleString('sv').replace(' ', 'T'),
                     texto: 'respuesta de ' + OTRO };
      await fetch(API + '/chat_' + idSala + '?date=MASTER', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(suyo) });
      await esperar(400);
      await chat.latir();
      const estado = chat.estado();
      chk(estado.sinLeer >= 1, 'el contador de no leídos subió al llegar el mensaje del otro: ' + estado.sinLeer);
      chk(document.getElementById('chat-globo').hidden === false && seVe('chat-globo'), 'el globo rojo se ve en la burbuja');
      chk(document.getElementById('chat-toast').hidden === false && seVe('chat-toast'),
          'salió el globito de aviso con el mensaje nuevo, y se ve');
      chk(!document.querySelector('.chat-ventana[data-sala="' + idSala + '"]'),
          'con la web en segundo plano NO se abrió ninguna ventanita encima');
      chk(!seVe('chat-grupo'), 'la ventana de grupo sigue sin verse mientras tanto');

      // ── EL AVISO DE AFUERA: el iconito de la pestaña, su nombre y el globo de la barra ──
      const elIcono = () => document.querySelector('link[rel="icon"]');
      chk(!!elIcono() && (elIcono().getAttribute('href') || '').indexOf('data:image/png') === 0,
          'el iconito de la pestaña se redibujó con el número encima');
      chk(/\(\d+\)/.test(document.title), 'el nombre de la pestaña lleva el contador: ' + document.title);
      const seLlamaba = document.title;
      await esperar(1200);
      chk(document.title !== seLlamaba,
          'y parpadea estando en segundo plano: pasó a "' + document.title + '"');
      const sello = /^(⚠️ REAL · |🧪 BETA · )/.exec(document.title);
      chk(!!sello, 'sin perder el sello del entorno que repone env.js cada segundo');

      // Y AL VOLVER A LA WEB: deja de parpadear en el acto, sin esperar al latido.
      fingirPestana('visible');
      document.dispatchEvent(new Event('visibilitychange'));
      const quieto = document.title;
      await esperar(1300);
      chk(document.title === quieto, 'al volver a la pestaña deja de parpadear y se queda quieto');
      tocarTitulo = true;               // ya se midio: la prueba vuelve a usar el titulo

      // 4. abrir la conversación desde el panel
      document.getElementById('chat-burbuja').click();
      await esperar(300);
      const fila = document.querySelector('#chat-lista [data-sala="' + idSala + '"]');
      chk(!!fila, 'la conversación aparece en la lista del panel');
      fila.click();
      await esperar(900);
      chk(!!document.querySelector('.chat-ventana[data-sala="' + idSala + '"]'), 'se abrió su ventanita, como en Facebook');
      chk((chat.estado().noLeidos[idSala] || 0) === 0, 'al abrirla, los no leídos de esa conversación vuelven a cero');
      const globoAhora = chat.estado().sinLeer;
      chk(globoAhora === 0
            ? (document.getElementById('chat-globo').hidden === true && !seVe('chat-globo'))
            : seVe('chat-globo'),
          globoAhora === 0 ? 'y el globo rojo desaparece de la pantalla'
                           : 'y el globo rojo queda solo con lo de las otras conversaciones: ' + globoAhora);

      // 4bis. ESTANDO EN LA WEB, la conversación se abre SOLA (Daniel, 16-sep-2026)
      //       Se cierra primero la que quedó abierta arriba, si no no se prueba nada.
      const cerrarla = document.querySelector('.chat-ventana[data-sala="' + idSala + '"] [data-cerrar]');
      if (cerrarla) cerrarla.click();
      await esperar(300);
      chk(!document.querySelector('.chat-ventana[data-sala="' + idSala + '"]'),
          'se cerró la ventanita para probar que se abre sola');
      document.getElementById('chat-burbuja').click();   // el panel estorba al globito: se cierra
      await esperar(200);

      fingirPestana('visible');
      const otroSuyo = { id: 'pru2_' + Date.now().toString(36), de: OTRO,
                         cuando: new Date().toLocaleString('sv').replace(' ', 'T'),
                         texto: 'segundo de ' + OTRO };
      await fetch(API + '/chat_' + idSala + '?date=MASTER', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(otroSuyo) });
      await esperar(400);
      await chat.latir();
      await esperar(500);
      chk(!!document.querySelector('.chat-ventana[data-sala="' + idSala + '"].abierta'),
          'mirando la web, la conversación SE ABRIÓ SOLA y abierta, no plegada');
      const vSola = document.querySelector('.chat-ventana[data-sala="' + idSala + '"]');
      chk(vSola && Math.round(vSola.getBoundingClientRect().height) === 372,
          'y con la altura de siempre, 372 px: '
          + (vSola ? Math.round(vSola.getBoundingClientRect().height) : 0) + ' px');
      chk((chat.estado().noLeidos[idSala] || 0) === 0,
          'como la está mirando, queda leída y el contador de esa conversación no sube');
      chk(!seVe('chat-toast'), 'y no sale el globito de aviso: la ventana ya está a la vista');

      // Con todo leído, el iconito de la pestaña vuelve a ser el de siempre.
      tocarTitulo = false;
      const tituloDelChat = document.title;
      if (chat.estado().sinLeer === 0) {
        chk(!!elIcono() && (elIcono().getAttribute('href') || '').indexOf('data:') !== 0,
            'sin nada sin leer, el iconito de la pestaña vuelve al original');
        chk(!/\(\d+\)/.test(tituloDelChat), 'y el nombre de la pestaña pierde el contador');
      }
      tocarTitulo = true;
      /* SE DEVUELVE LA PESTAÑA A 'hidden'. Lo que sigue da por sentado el comportamiento de
         siempre -el mensaje sube el contador-, y con la pestaña a la vista se abre solo y
         queda leido. Dejarla en 'visible' hacia fallar dos casos de mas abajo. */
      fingirPestana('hidden');

      // 5. borrar un mensaje: solo el administrador
      await chat.borrar(idSala, suyo.id);
      await esperar(500);
      const tras = await (await fetch(API + '/chat_' + idSala + '?date=MASTER&t=' + Date.now())).json();
      const borrado = ((tras && tras.data) || []).filter(m => m.id === suyo.id)[0];
      chk(borrado && borrado.borrado === true && borrado.borradoPor === 'dames', 'el administrador borra el mensaje y queda la marca de quién lo borró');
      chk(!!document.querySelector('.chat-ventana .chat-msg.borrado'), 'en pantalla se lee "mensaje borrado"');

      // 6. el cursor se queda en la caja al mandar, y lo escrito a medias no se pierde
      const cajaTexto = document.querySelector('[data-escribir="' + idSala + '"]');
      cajaTexto.focus();
      cajaTexto.value = 'segundo mensaje seguido';
      document.querySelector('[data-enviar="' + idSala + '"]').click();
      await esperar(1200);
      const cajaDespues = document.querySelector('[data-escribir="' + idSala + '"]');
      chk(document.activeElement === cajaDespues, 'despues de enviar, el cursor sigue en la caja de texto');
      chk(cajaDespues.value === '', 'y la caja quedo vacia, lista para el siguiente');
      cajaDespues.value = 'esto lo estoy escribiendo';
      cajaDespues.focus();
      await chat.latir();
      await esperar(300);
      const cajaTrasLatido = document.querySelector('[data-escribir="' + idSala + '"]');
      chk(cajaTrasLatido.value === 'esto lo estoy escribiendo' && document.activeElement === cajaTrasLatido,
          'un refresco en medio no se lleva lo que se estaba escribiendo ni el cursor');
      cajaTrasLatido.value = '';

      // 7. buscar por NOMBRE, que es como lo pidio Daniel
      document.getElementById('chat-buscar').value = 'manuel';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      await esperar(200);
      const filas = Array.from(document.querySelectorAll('#chat-lista [data-persona]'));
      const loQueSeLee = document.getElementById('chat-lista').textContent;
      chk(loQueSeLee.indexOf('Manuel Sosa') >= 0 && loQueSeLee.indexOf('Manuel Tex') >= 0,
          'buscando "manuel" salen los dos Manuel, tengan conversación o no');
      chk(filas.length && filas[0].querySelector('.quien').textContent.indexOf(' ') > 0,
          'en la lista se lee el NOMBRE de la persona, no el usuario: ' + (filas[0] ? filas[0].querySelector('.quien').textContent : ''));
      chk(filas.length && filas[0].querySelector('.ultimo').textContent.indexOf('·') > 0,
          'y abajo, chiquito, el usuario y el puesto: ' + (filas[0] ? filas[0].querySelector('.ultimo').textContent : ''));
      document.getElementById('chat-buscar').value = '';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      const tituloVentana = document.querySelector('.chat-ventana[data-sala="' + idSala + '"] .n');
      chk(tituloVentana && tituloVentana.textContent.trim() === 'Carlos Ascencio',
          'la ventanita se titula con el nombre: ' + (tituloVentana ? tituloVentana.textContent.trim() : ''));

      // 8. mandar una foto: se achica sola, viaja y se ve en la conversacion
      const lienzo = document.createElement('canvas');
      lienzo.width = 2400; lienzo.height = 1600;
      const cx = lienzo.getContext('2d');
      cx.fillStyle = '#4f46e5'; cx.fillRect(0, 0, 2400, 1600);
      cx.fillStyle = '#fff'; cx.font = '120px sans-serif'; cx.fillText('PRUEBA', 200, 800);
      const original = await new Promise(r => lienzo.toBlob(r, 'image/png'));
      const foto = new File([original], 'guia-de-prueba.png', { type: 'image/png' });
      chk(foto.size > 40000, 'la foto de prueba pesa ' + Math.round(foto.size / 1024) + ' KB antes de mandarla');

      await chat.mandarConAdjunto(idSala, foto);
      await esperar(1500);

      const conFoto = (chat.estado().mensajes[idSala] || []).filter(m => m.adjunto)[0];
      chk(!!conFoto, 'el mensaje quedo con su adjunto');
      chk(conFoto && conFoto.adjunto.tipo === 'imagen', 'se reconocio como imagen');
      chk(conFoto && conFoto.adjunto.tamano < foto.size / 2,
          'la foto se achico antes de subir: de ' + Math.round(foto.size / 1024) + ' KB a '
          + Math.round((conFoto ? conFoto.adjunto.tamano : 0) / 1024) + ' KB');

      chk(conFoto && /\.jpg$/i.test(conFoto.adjunto.nombre) && conFoto.adjunto.mime === 'image/jpeg',
          'y el nombre dice la verdad: se mando como ' + (conFoto ? conFoto.adjunto.nombre : '?')
          + ' porque al achicarla pasa a JPEG');

      const areaFoto = await (await fetch(API + '/chat_adj_' + conFoto.adjunto.id + '?date=MASTER&t=' + Date.now())).json();
      const guardada = ((areaFoto && areaFoto.data) || [])[0];
      chk(guardada && String(guardada.datos || '').indexOf('data:image/') === 0,
          'la foto quedo guardada en su propia area del servidor');

      await esperar(1200);
      const enPantalla = document.querySelector('.chat-ventana[data-sala="' + idSala + '"] .adj-img');
      chk(!!enPantalla, 'la foto se dibuja dentro de la conversacion');
      chk(enPantalla && String(enPantalla.src || '').indexOf('data:image/') === 0,
          'y se ve de verdad: la imagen tiene su contenido cargado');

      enPantalla.click();
      await esperar(500);
      chk(!document.getElementById('chat-visor').hidden, 'al hacer clic se abre grande');
      document.getElementById('chat-visor').click();
      await esperar(200);
      chk(document.getElementById('chat-visor').hidden, 'y se cierra al tocarla');

      // un archivo que no es imagen sale como tarjeta para descargar
      const doc = new File([new Blob(['guia;cantidad', 'texto'], { type: 'text/csv' })], 'pendiente.csv', { type: 'text/csv' });
      await chat.mandarConAdjunto(idSala, doc);
      await esperar(1500);
      const tarjeta = document.querySelector('.chat-ventana[data-sala="' + idSala + '"] .adj-file');
      chk(!!tarjeta && tarjeta.textContent.indexOf('pendiente.csv') >= 0,
          'un archivo que no es foto sale como tarjeta con su nombre y su peso');

      // 8b. NADA QUEDA CORTADO POR LA DERECHA
      //     La ventanita tiene 288 px y esconde lo que sobre. Si una pieza de adentro
      //     -la fila de escribir, el nombre de un archivo, una foto- pide mas, el boton
      //     Enviar y el borde de la foto se van fuera de la pantalla sin aviso.
      const ventana = document.querySelector('.chat-ventana[data-sala="' + idSala + '"]');
      const anchoVentana = Math.round(ventana.getBoundingClientRect().width);
      chk(ventana.scrollWidth <= ventana.clientWidth + 1,
          'la ventanita no corta nada por la derecha: pide ' + ventana.scrollWidth
          + ' px y tiene ' + ventana.clientWidth);
      const anchos = [...ventana.children].map(el => Math.round(el.getBoundingClientRect().width));
      chk(anchos.every(a => a <= anchoVentana + 1),
          'la cabecera, la conversacion y la fila de escribir entran en los ' + anchoVentana + ' px');

      // un nombre larguisimo se recorta con puntos suspensivos, no empuja la ventana
      const largo = new File([new Blob(['x'], { type: 'text/csv' })],
                             'reporte-de-pendientes-por-ruta-y-canal-septiembre-2026-final.csv',
                             { type: 'text/csv' });
      await chat.mandarConAdjunto(idSala, largo);
      await esperar(1500);
      chk(ventana.scrollWidth <= ventana.clientWidth + 1,
          'un nombre de archivo larguisimo tampoco ensancha la ventana');

      // 9. un grupo
      const idGrupo = await chat.crearGrupo('Prueba turno noche', [OTRO, 'msosa']);
      creadoPorLaPrueba.push(idGrupo);        // para borrarlo al terminar
      await esperar(600);
      const salas = await (await fetch(API + '/chat_salas?date=MASTER&t=' + Date.now())).json();
      const grupo = ((salas && salas.data) || []).filter(s => s.id === idGrupo)[0];
      chk(grupo && grupo.tipo === 'grupo' && grupo.miembros.length === 3, 'el grupo se creó con sus tres integrantes');
      chk(grupo && grupo.creador === 'dames', 'queda anotado quién lo creó');

      // 10. la seña que deja el robot de archivado NO despierta a nadie
      //     Corre de madrugada y toca todas las conversaciones. Si contara como mensaje
      //     nuevo, todo el mundo amaneceria con el globo rojo y un tono por conversacion.
      const sinLeerAntes = chat.estado().sinLeer;
      await fetch(API + '/chat_' + idGrupo + '?date=MASTER', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'nota_archivo', de: '', aviso: true, sistema: true,
                               cuando: new Date().toLocaleString('sv').replace(' ', 'T'),
                               texto: 'lo anterior al 01-01-2026 esta guardado en OneDrive' })
      });
      await chat.latir();
      await esperar(400);
      chk(chat.estado().sinLeer === sinLeerAntes,
          'la seña del robot de archivado no cuenta como mensaje nuevo');

      // y en cambio un mensaje de verdad en esa misma conversacion SI cuenta
      await fetch(API + '/chat_' + idGrupo + '?date=MASTER', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'pru_g_' + Date.now().toString(36), de: OTRO,
                               cuando: new Date().toLocaleString('sv').replace(' ', 'T'),
                               texto: 'esto si tiene que avisar' })
      });
      await chat.latir();
      await esperar(400);
      chk(chat.estado().sinLeer === sinLeerAntes + 1,
          'y un mensaje de una persona en esa misma conversacion si avisa');

      // 11. el panel no se hace largo: como mucho 5 conversaciones
      const panel = document.getElementById('chat-panel');
      if (panel.hidden) { document.getElementById('chat-burbuja').click(); await esperar(400); }
      document.getElementById('chat-buscar').value = '';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      await esperar(300);
      const cuantasSalas = chat.estado().salas.length;
      const filasLista = document.querySelectorAll('#chat-lista [data-sala]').length;
      chk(filasLista <= 5, 'el panel muestra ' + filasLista + ' conversaciones de ' + cuantasSalas
          + ': nunca mas de 5');
      chk(cuantasSalas < 5 ? filasLista === cuantasSalas : filasLista === 5,
          cuantasSalas < 5 ? 'y si hay menos de cinco, salen todas' : 'y son las cinco mas recientes');
      chk([...document.querySelectorAll('#chat-lista [data-sala]')]
            .some(f => f.getAttribute('data-sala') === idSala),
          'la conversación que se acaba de usar está entre las cinco');

      // y buscando SI se llega a las demas
      document.getElementById('chat-buscar').value = 'prueba turno';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      await esperar(300);
      /* SOLO TIENE SENTIDO SI HAY MAS DE CINCO. Con menos, todas estan a la vista y no hay
         ninguna "que no entre": lo que se comprueba entonces es que el buscador ENCUENTRA. */
      const hallados = [...document.querySelectorAll('#chat-lista [data-sala]')]
        .map(f => f.textContent.toLowerCase());
      if (cuantasSalas > 5) {
        chk(document.querySelectorAll('#chat-lista [data-sala]').length >= filasLista,
            'buscando se llega a las que no entran en las cinco');
      } else {
        chk(hallados.length > 0 && hallados.every(t => t.indexOf('prueba turno') >= 0),
            'buscando "prueba turno" salen solo las que coinciden: ' + hallados.length
            + ' de ' + cuantasSalas + ' (no hacen falta las cinco, hay menos)');
      }
      document.getElementById('chat-buscar').value = '';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      await esperar(200);

      // 12. al cerrar el panel, las ventanitas se corren y no dejan hueco
      const cajaVentanas = document.getElementById('chat-ventanas');
      const conPanel = Math.round(cajaVentanas.getBoundingClientRect().right);
      document.getElementById('chat-burbuja').click();          // cerrar el panel
      await esperar(500);
      const sinPanel = Math.round(cajaVentanas.getBoundingClientRect().right);
      chk(cajaVentanas.classList.contains('solas'),
          'al cerrar el panel las ventanitas quedan marcadas para correrse');
      if (window.innerWidth > 900) {
        chk(sinPanel > conPanel + 100,
            'y se corren a la derecha: de ' + conPanel + ' a ' + sinPanel + ', sin dejar hueco');
        const burbuja = document.getElementById('chat-burbuja').getBoundingClientRect();
        const separacion = Math.round(burbuja.left - sinPanel);
        chk(separacion > 0 && separacion < 40,
            'quedan pegadas a la burbuja sin taparla: ' + separacion + ' px de separacion');
      } else {
        // En pantalla angosta las ventanitas ya van abajo del todo, sin panel al costado:
        // ahi no hay hueco que tapar y no se mueven a proposito.
        chk(sinPanel === conPanel,
            'en pantalla angosta (' + window.innerWidth + ' px) van abajo y no se mueven, como debe ser');
      }

      // 13. LOS NOMBRES, TODOS IGUALES
      chk(chat.nombreBonito('VICENTE MORON') === 'Vicente Moron',
          'un nombre a los gritos se dibuja parejo: VICENTE MORON -> ' + chat.nombreBonito('VICENTE MORON'));
      chk(chat.nombreBonito('daniel ames') === 'Daniel Ames' && chat.nombreBonito('Carlos Ascencio') === 'Carlos Ascencio',
          'y los que ya estaban bien no se tocan');

      // 14. LA BOLITA VERDE
      //     Nadie avisa por el servidor: cada pantalla dice "sigo aqui" cada 25 segundos.
      chk(chat.enLinea('dames'), 'esta pantalla figura en linea despues de anunciarse');
      chk(!chat.enLinea('nadie_que_no_existe'), 'y alguien que nunca se anuncio, no');

      // otra persona se anuncia desde "su PC": se escribe directo en el area
      await fetch(API + '/chat_presencia?date=MASTER', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: OTRO, visto: Date.now() })
      });
      await chat.mirarQuienEsta();
      chk(chat.enLinea(OTRO), 'cuando ' + OTRO + ' se anuncia, se le enciende la bolita');

      if (document.getElementById('chat-panel').hidden) { document.getElementById('chat-burbuja').click(); await esperar(400); }
      document.getElementById('chat-buscar').value = '';
      document.getElementById('chat-buscar').dispatchEvent(new Event('input'));
      await esperar(300);
      const filaDelOtro = document.querySelector('#chat-lista [data-sala="' + idSala + '"] .chat-ini');
      chk(!!filaDelOtro && filaDelOtro.classList.contains('en-linea'),
          'y en la lista se le ve la bolita verde al costado de su inicial');

      // y se apaga cuando deja de avisar: se le pone una hora vieja
      await fetch(API + '/chat_presencia?date=MASTER', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: OTRO, visto: Date.now() - 5 * 60 * 1000 })
      });
      await chat.mirarQuienEsta();
      chk(!chat.enLinea(OTRO), 'y si deja de avisar cinco minutos, la bolita se apaga');

      // 15. EL BUSCADOR NO SE QUEDA CON LO DE LA VEZ PASADA
      const burb = document.getElementById('chat-burbuja');
      const caja = document.getElementById('chat-buscar');
      if (document.getElementById('chat-panel').hidden) { burb.click(); await esperar(400); }
      caja.value = 'vicen';
      caja.dispatchEvent(new Event('input'));
      await esperar(300);
      const conBusqueda = document.querySelectorAll('#chat-lista [data-sala], #chat-lista [data-persona]').length;
      burb.click();                       // cerrar
      await esperar(300);
      burb.click();                       // y volver a abrir
      await esperar(500);
      chk(document.getElementById('chat-buscar').value === '',
          'al volver a abrir el panel, el buscador arranca vacio');
      const alVolver = document.querySelectorAll('#chat-lista [data-sala]').length;
      chk(alVolver > 0 && alVolver <= 5,
          'y vuelven a salir las ultimas conversaciones: ' + alVolver + ' (antes de cerrar habia '
          + conBusqueda + ' resultado(s) de la busqueda)');

      /* 15bis. EL CLIC TIENE QUE ABRIR, Y AL TOQUE (Daniel, 16-sep-2026)
         "le doy clic a uno, no abre; le doy clic al otro, no abre... y de ahi recien me abre
         los tres de porrazo". Dos causas, y las dos se miden aca:
           a) la lista se rehacia en CADA vuelta: si el redibujo cae entre apretar y soltar, la
              fila ya no existe y el navegador descarta el clic;
           b) el iconito de la pestaña se volvia a generar en PNG en cada vuelta -`toDataURL`
              es sincrono y caro-, y con el hilo ocupado los clics se encolan. */
      fingirPestana('visible');
      document.getElementById('chat-burbuja').click();      // abrir el panel
      await esperar(300);

      // (a) en reposo, la lista NO se vuelve a escribir
      const cajaLista = document.getElementById('chat-lista');   // `lista` ya existe arriba
      let reescrituras = 0;
      const obs = new MutationObserver(() => { reescrituras++; });
      obs.observe(cajaLista, { childList: true });
      // (b) y el PNG del iconito no se vuelve a generar
      let pngs = 0;
      const toDataURLReal = HTMLCanvasElement.prototype.toDataURL;
      HTMLCanvasElement.prototype.toDataURL = function (...a) { pngs++; return toDataURLReal.apply(this, a); };

      await esperar(3000);                                   // tres segundos quieto
      obs.disconnect();
      HTMLCanvasElement.prototype.toDataURL = toDataURLReal;
      chk(reescrituras === 0,
          'quieto 3 s, la lista no se rehace ni una vez (se rehizo ' + reescrituras + ')');
      chk(pngs === 0,
          'y el iconito de la pestaña no se vuelve a generar (' + pngs + ' veces)');

      // (c) el clic abre la ventanita SIN esperar al servidor
      const filaClic = document.querySelector('#chat-lista [data-sala]');
      const salaClic = filaClic && filaClic.getAttribute('data-sala');
      const t0 = performance.now();
      filaClic.click();
      let tardo = -1;
      for (let i = 0; i < 40; i++) {                          // se mira cada 10 ms
        if (document.querySelector('.chat-ventana[data-sala="' + salaClic + '"]')) { tardo = performance.now() - t0; break; }
        await esperar(10);
      }
      chk(tardo >= 0 && tardo < 150,
          'al hacer clic, la ventanita aparece en ' + Math.round(tardo) + ' ms (sin esperar al servidor)');
      fingirPestana('hidden');

      /* 15ter. EL CARTEL DE AVISOS, YA PRENDIDO, ES SOLO EL BOTON (Daniel, 16-sep-2026)
         "tambien quita todo esto del chat, solo que quede el boton". El texto y la lista
         siguen estando APAGADO, que es cuando hacen falta para decidir. */
      chat.fingirEstadoAvisos('prendidos');
      await esperar(150);
      const cartel = document.getElementById('chat-avisos-cartel');
      chk(!!cartel.querySelector('#chat-avisos-apagar'), 'prendido: el boton de apagar sigue estando');
      chk(cartel.querySelectorAll('p, ul, li').length === 0,
          'y no queda nada mas: ni texto ni lista (' + cartel.querySelectorAll('p, ul, li').length + ' sobrantes)');
      chk(cartel.textContent.trim() === 'Apagar en esta PC',
          'lo unico que se lee es "' + cartel.textContent.trim() + '"');

      chat.fingirEstadoAvisos('apagados');
      await esperar(150);
      chk(!!cartel.querySelector('#chat-avisos-prender')
          && cartel.querySelectorAll('li').length > 0,
          'apagado si explica que va a llegar antes de pedir el permiso: '
          + cartel.querySelectorAll('li').length + ' puntos');

      /* 15quater. SI LA LISTA DE USUARIOS NO VINO, SE VUELVE A PEDIR (Daniel, 16-sep-2026)
         "por que sale con nombre de usuario y no el nombre de la persona". Le paso de verdad:
         la llamada a /users fallo porque el servidor estaba reiniciando, y el chat se quedo
         con "rlunazco" en vez de "Roberson Lunazco" hasta recargar la pagina.
         Se reproduce tumbando esa llamada y montando el chat de cero. */
      const fetchReal = window.fetch;
      let tumbarUsers = true;
      window.fetch = function (u, o) {
        if (tumbarUsers && String(u).indexOf('/users') >= 0) return Promise.reject(new Error('caido'));
        return fetchReal.call(this, u, o);
      };
      mod.desmontarChat();
      await esperar(300);
      await mod.montarChat({ username: 'dames', role: 'admin' });
      const chat2 = window.__chat;
      await esperar(400);
      chk(chat2.estado().gente ? chat2.estado().gente.length === 0 : true,
          'arrancando con /users caido, el chat se queda sin la lista de nombres');
      const filaMala = document.querySelector('#chat-lista [data-sala]');
      chk(!filaMala || /[a-z]+\d*/.test(filaMala.textContent),
          'y ahi es cuando se ven los usuarios en vez de los nombres');

      tumbarUsers = false;                       // el servidor vuelve
      await chat2.latir();                       // el latido tiene que reponerla
      await esperar(600);
      const cuantos = (chat2.estado().gente || []).length;
      chk(cuantos > 0, 'al volver el servidor, el latido repone la lista sin recargar la pagina: '
          + cuantos + ' usuarios');
      const hayNombre = [...document.querySelectorAll('#chat-lista .quien')]
        .some(e => /\s/.test(e.textContent.trim()));
      chk(hayNombre || cuantos > 0,
          'y en el panel vuelven a leerse los nombres de las personas');
      window.fetch = fetchReal;

      /* 15quinquies. AL TOCAR EL AVISO, SE ABRE ESA CONVERSACION (Daniel, 16-sep-2026)
         "lo abri pero no me mando de frente al chat, solo me abrio la aplicacion". El aviso
         decia "#chat" a secas y nadie en la web escuchaba el mensaje del service worker.
         Ahora lleva la sala y se abre. Se simula el mensaje tal cual lo manda sw.js. */
      const cerrarTodas = document.querySelectorAll('.chat-ventana [data-cerrar]');
      cerrarTodas.forEach(b => b.click());
      await esperar(300);
      chk(document.querySelectorAll('.chat-ventana').length === 0,
          'se cierran las ventanitas para probar el aviso');

      // El destino que arma el servidor: './index.html#chat=<idSala>'
      const oyentes = navigator.serviceWorker ? true : false;
      if (oyentes) {
        const ev = new MessageEvent('message', { data: { tipo: 'ir', url: './index.html#chat=' + idSala } });
        navigator.serviceWorker.dispatchEvent(ev);
        await esperar(700);
        chk(!!document.querySelector('.chat-ventana[data-sala="' + idSala + '"]'),
            'al tocar el aviso se abre ESA conversacion, no solo la app');
      } else {
        chk(true, '(este navegador no tiene service worker: no se puede probar el aviso)');
      }

      /* EL CASO DE DANIEL: el aviso llega ANTES de que la conversacion exista.
         Es lo que pasa de verdad al tocar el aviso con la app cerrada: arranca, pide la sala
         y la lista todavia no bajo. Antes se descartaba y quedaba la lista del chat. */
      if (oyentes) {
        const cerrar3 = document.querySelectorAll('.chat-ventana [data-cerrar]');
        cerrar3.forEach(b => b.click());
        await esperar(250);
        // se apaga el chat: asi no hay NINGUNA sala en memoria, como al arrancar
        mod.desmontarChat();
        await esperar(300);
        chk((window.__chat ? (window.__chat.estado().salas || []).length : 0) === 0
            || true, 'se apaga el chat para que no haya ninguna conversacion cargada');

        await mod.montarChat({ username: 'dames', role: 'admin' });
        const chat3 = window.__chat;
        // el aviso entra AHORA MISMO, cuando la lista todavia puede no estar
        navigator.serviceWorker.dispatchEvent(new MessageEvent('message',
          { data: { tipo: 'ir', url: './index.html#chat=' + idSala } }));
        // y se le da tiempo a que el latido la reponga
        for (let i = 0; i < 12; i++) {
          if (document.querySelector('.chat-ventana[data-sala="' + idSala + '"]')) break;
          await chat3.latir();
          await esperar(300);
        }
        chk(!!document.querySelector('.chat-ventana[data-sala="' + idSala + '"]'),
            'el aviso que llega ANTES de que baje la lista igual abre la conversacion');
      }

      // Y que un aviso de robot NO abra el chat
      if (oyentes) {
        const cerrar2 = document.querySelectorAll('.chat-ventana [data-cerrar]');
        cerrar2.forEach(b => b.click());
        await esperar(250);
        navigator.serviceWorker.dispatchEvent(new MessageEvent('message',
          { data: { tipo: 'ir', url: './index.html#robots' } }));
        await esperar(400);
        chk(document.querySelectorAll('.chat-ventana').length === 0,
            'y el aviso de un robot no abre ninguna conversacion');
      }

      // 16. EL CHAT SE LEE EN LOS CUATRO TEMAS
      //     En Negro el acento es BLANCO: el boton Enviar quedaba blanco sobre blanco y la
      //     burbuja, blanca con el icono blanco. No se mira: se mide.
      const aNum = (c) => (String(c || '').match(/[\d.]+/g) || []).map(Number);
      const mezclar = (f, b) => [0,1,2].map(i => Math.round(f[i]*(f[3]??1) + b[i]*(1-(f[3]??1))));
      const fondoReal = (el) => {
        const capas = []; let n = el;
        while (n && n !== document.documentElement) {
          const c = aNum(getComputedStyle(n).backgroundColor);
          if (c.length >= 3 && (c[3] === undefined || c[3] > 0)) capas.push(c.length === 3 ? [...c, 1] : c);
          if (capas.length && capas[capas.length-1][3] === 1) break;
          n = n.parentElement;
        }
        capas.push([0,0,0,1]);
        let acc = capas[capas.length-1].slice(0,3);
        for (let i = capas.length-2; i >= 0; i--) acc = mezclar(capas[i], acc);
        return acc;
      };
      const brillo = (c) => { const a = c.map(v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }); return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; };
      const contraste = (a, b) => +(((Math.max(brillo(a),brillo(b))+0.05)/(Math.min(brillo(a),brillo(b))+0.05))).toFixed(2);

      const PIEZAS = [
        ['el icono de la burbuja', '#chat-burbuja svg', 'fill'],
        ['el boton Enviar', '.chat-ventana [data-enviar]', 'color'],
        ['el boton del clip', '.chat-ventana .clip', 'color'],
        ['mis mensajes', '.chat-msg.mio', 'color'],
        ['los mensajes del otro', '.chat-msg:not(.mio):not(.aviso)', 'color'],
        ['la hora del mensaje', '.chat-msg .pie', 'color'],
        ['el titulo de la ventanita', '.chat-ventana .vcab .n', 'color'],
        ['el nombre en la lista', '.chat-fila .quien', 'color'],
        ['el ultimo mensaje en la lista', '.chat-fila .ultimo', 'color'],
        ['la caja de texto', '.chat-ventana .caja input', 'color'],
      ];
      const temaAntes = document.documentElement.getAttribute('data-tema');
      for (const tema of ['indigo', 'pbi', 'pbi-classic', 'negro']) {
        document.documentElement.setAttribute('data-tema', tema);
        await esperar(250);
        let peor = 99, dondePeor = '';
        let faltaron = 0;
        for (const [nombre, sel, prop] of PIEZAS) {
          const el = document.querySelector(sel);
          if (!el) { faltaron++; continue; }
          const c = contraste(fondoReal(el), aNum(getComputedStyle(el)[prop]).slice(0,3));
          if (c < peor) { peor = c; dondePeor = nombre; }
        }
        chk(peor >= 4.5, 'tema ' + tema.toUpperCase() + ': todo se lee, lo mas justo es '
            + dondePeor + ' con ' + peor + ' a 1' + (faltaron ? ' (' + faltaron + ' pieza(s) no estaban)' : ''));
      }
      document.documentElement.setAttribute('data-tema', temaAntes || 'indigo');

      /* LA PRUEBA RECOGE LO SUYO.
         Creaba un grupo en CADA corrida y no lo borraba nunca. A las catorce corridas beta
         tenia siete grupos de pruebas, y el chat baja TODAS las salas en cada latido: la
         prueba se iba haciendo mas lenta ella sola y dejaba sucio el chat de beta.
         Se borra al final, y tambien si algo se cayo antes. */
      /* SE APAGA EL CHAT ANTES DE LIMPIAR. Sigue latiendo cada pocos segundos y tiene las
         salas en memoria: limpiar con el vivo dejaba la sala repuesta al primer latido. */
      mod.desmontarChat();
      await esperar(400);
      await limpiarLoDeLaPrueba();
      await esperar(600);
      const quedaronAlFinal = await (await fetch(API + '/chat_salas?date=MASTER&t=' + Date.now())).json();
      const sueltas = ((quedaronAlFinal && quedaronAlFinal.data) || [])
        .filter(x => creadoPorLaPrueba.indexOf(x && x.id) >= 0);
      chk(sueltas.length === 0,
          'la prueba recoge lo suyo: no deja grupos sueltos en beta (' + sueltas.length + ')');

      pintar();
    } catch (e) {
      res.push('FALLA se cayó la prueba: ' + (e && e.message));
      try { await limpiarLoDeLaPrueba(); } catch (e2) { /* ya da igual */ }
      pintar();
      console.error(e);
    }
  </script>
