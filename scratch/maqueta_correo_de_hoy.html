  MAQUETA del submodulo `Despacho > Correo de Hoy`, pedido el 09-sep-2026.
  Datos REALES del correo de esa noche. Los cuadros salen recortados de
  `js/reportes/pendiente.js`, no reescritos.

<link rel="stylesheet" href="../css/temas.css">

    /* El cuadro de rutas ocupa la fila entera: son 22 filas y en una columna

    #pend .pend-zona td{font-weight:800;color:var(--text-strong);

    #pend .pend-sub{color:var(--text-muted);font-size:var(--t-sm)}
    #pend .pend-acc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

       cambiar de fecha?". Y se agranda, porque el de fabrica es diminuto.
       OJO: nada de comillas invertidas aca adentro, que esto vive dentro de una
       plantilla de texto y la cortan. */

      border-radius:8px;color:var(--text-strong);padding:8px 10px;font-size:var(--t-sm);font-weight:700;

      filter:invert(88%) sepia(20%) saturate(900%) hue-rotate(200deg) brightness(115%)}

const anchoBarra = (v, max) => (max > 0 ? Math.max(2, Math.round(100 * v / max)) : 0);
const esc = (t) => String(t == null ? '' : t)

    .replace(/"/g, '&quot;');
const cuadro = (titulo, pie, filas, opciones) => {
    const o = opciones || {};
    const tope = o.tope || 8;
    const conPed = o.conPed !== false;
    const conPct = !!o.conPct;
    const lista = (filas || []).slice(0, tope);
    const max = lista.reduce((m, f) => Math.max(m, Number(f.und) || 0), 0);
    const total = (filas || []).reduce((s, f) => s + (Number(f.und) || 0), 0);
    const resto = (filas || []).length - lista.length;

    if (!lista.length) {
        return `<div class="pend-panel"><h3>${esc(titulo)}</h3>
            <div class="pend-cap">${esc(pie)}</div>
            <div class="pend-vacio">Sin datos para esta fecha</div></div>`;
    }

    return `<div class="pend-panel">
        <h3>${esc(titulo)}</h3>
        <div class="pend-cap">${esc(pie)}</div>
        <table>
          <thead><tr>
            <th>${esc(o.etiqueta || 'DETALLE')}</th>
            ${conPed ? '<th class="n">PEDIDOS</th>' : ''}
            <th class="n">UNIDADES</th>
            ${conPct ? '<th class="n">%</th>' : ''}
          </tr></thead>
          <tbody>
            ${lista.map(f => {
                const und = Number(f.und) || 0;
                const destacar = o.destacar && o.destacar(f);
                return `<tr${destacar ? ' class="pend-ojo"' : ''}>
                  <td>${esc(f.k)}</td>
                  ${conPed ? `<td class="n">${nf(f.ped)}</td>` : ''}
                  <td class="n">${nf(und)}
                    <span class="pend-bar${destacar ? ' ambar' : ''}"
                          style="width:${anchoBarra(und, max)}%"></span></td>
                  ${conPct ? `<td class="n">${total ? Math.round(100 * und / total) : 0}%</td>` : ''}
                </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${resto > 0 ? `<span class="pend-mas">▸ y ${nf(resto)} más</span>` : ''}
        ${o.nota ? `<div class="pend-nota">${o.nota}</div>` : ''}
      </div>`;
};

    const lista = filas || [];
    if (!lista.length) {
        return `<div class="pend-panel pend-ancho"><h3>POR RUTA DE DESPACHO</h3>
            <div class="pend-cap">Zona y ruta, partido en calzado y accesorios</div>
            <div class="pend-vacio">Sin datos para esta fecha</div></div>`;
    }

    const tot = { acc: 0, cal: 0 };
    lista.forEach(f => { tot.acc += Number(f.acc) || 0; tot.cal += Number(f.cal) || 0; });

    const bloque = (zona) => {
        const suyas = lista.filter(f => f.z === zona);
        if (!suyas.length) return '';
        const sa = suyas.reduce((s, f) => s + (Number(f.acc) || 0), 0);
        const sc = suyas.reduce((s, f) => s + (Number(f.cal) || 0), 0);
        return `<tr class="pend-zona">
            <td>${esc(zona)}</td>
            <td class="n">${nf(sa)}</td><td class="n">${nf(sc)}</td>
            <td class="n">${nf(sa + sc)}</td></tr>` +
          suyas.map(f => `<tr>
            <td class="pend-sangria">${esc(f.k)}</td>
            <td class="n">${nf(f.acc)}</td><td class="n">${nf(f.cal)}</td>
            <td class="n">${nf(f.und)}</td></tr>`).join('');
    };

    const perdidas = sinCruce && Number(sinCruce.und) > 0
        ? `<div class="pend-nota"><b>${nf(sinCruce.und)} unidades</b> de
           ${nf(sinCruce.tiendas)} tiendas no figuran en el maestro de rutas y quedan
           fuera de este cuadro.</div>`
        : '';

    return `<div class="pend-panel pend-ancho">
        <h3>POR RUTA DE DESPACHO</h3>
        <div class="pend-cap">El mismo corte que arma comercial: zona y ruta, partido
          en calzado y accesorios</div>
        <table>
          <thead><tr>
            <th>ZONA / RUTA</th>
            <th class="n">ACCESORIOS</th><th class="n">CALZADO</th>
            <th class="n">TOTAL</th>
          </tr></thead>
          <tbody>
            ${bloque('LIMA')}${bloque('PROVINCIA')}
            <tr class="pend-total">
              <td>TOTAL GENERAL</td>
              <td class="n">${nf(tot.acc)}</td><td class="n">${nf(tot.cal)}</td>
              <td class="n">${nf(tot.acc + tot.cal)}</td></tr>
          </tbody>
        </table>
        ${perdidas}
        <div class="pend-nota">En Lima la fila es el <b>día de despacho + turno</b>;
          en provincia, el <b>transportista</b>. Accesorios junta todo lo que el
          Maestro no marca como Footwear.</div>
      </div>`;
};

        <tr><td><b>Abierta en el WMS</b> → se puede trabajar</td>
            <td class="n"><b>${nf(D.wms.guias)}</b></td>
            <td class="n">${nf(D.pedidoAbiertas)}</td>
            <td class="n"><b>${nf(D.wms.unidades)}</b></td></tr>
        <tr class="pend-ojo"><td>Todavía no abierta en el WMS</td>
            <td class="n">${nf(D.sinAbrir.guias)}</td>
            <td class="n">${nf(D.sinAbrir.unidades)}</td>
            <td class="n">—</td></tr>
        <tr class="pend-total"><td>TOTAL DEL CORREO</td>
            <td class="n">${nf(D.correo.guias)}</td>
            <td class="n">${nf(D.correo.unidades)}</td>
            <td class="n">${nf(D.wms.unidades)}</td></tr>
      </tbody>
    </table>
    <div class="pend-nota"><b>${nf(D.sinAbrir.guias)} guías</b> de
      ${nf(D.sinAbrir.tiendas)} tiendas llegaron por correo y el WMS todavía no las
      tiene abiertas. Son ${nf(D.sinAbrir.unidades)} unidades que hoy no se pueden picar.</div>
  </div>`;

const rotulo = (t, c) => `<div class="pend-bloque"><h4>${t}</h4><div class="c">${c}</div></div>`;

const cuadros = [
  rotulo('LO QUE MANDÓ COMERCIAL HOY',
         `${nf(D.correo.guias)} guías &middot; ${nf(D.correo.unidades)} unidades &middot; la cantidad es la del correo`),
  llegada,
  cuadro('A QUÉ TIENDA HAY QUE DESPACHAR',
         `Las 10 más cargadas de ${nf(D.correo.tiendas)}`,
         D.tiendas, { etiqueta: 'TIENDA', tope: 10 }),
  cuadro('POR QUÉ LO PIDIÓ COMERCIAL', 'La columna Prioridad del correo',
         D.prioridad, { etiqueta: 'PRIORIDAD', tope: 8, conPct: true }),
  rotulo('DE ESO, LO QUE EL WMS TIENE ABIERTO',
         `${nf(D.wms.guias)} guías &middot; ${nf(D.wms.unidades)} unidades &middot; el correo no trae el artículo, así que estos cortes solo se pueden hacer sobre lo abierto`),
  cuadro('POR GENDER RIMS', 'Sale del Maestro de artículos',
         D.rims, { etiqueta: 'GENDER RIMS', tope: 10 }),
  cuadro('POR COLECCIÓN', 'La Coleccion PO del Maestro',
         D.coleccion, { etiqueta: 'COLECCIÓN', tope: 8, conPct: true }),
  cuadro('CALZADO Y LO QUE NO LO ES',
         'Lo separa el G. Gender del Maestro, no la etiqueta del correo',
         D.gender, { etiqueta: 'TIPO', tope: 6, conPed: false, conPct: true,
                     nota: 'Un total que mezcla zapatos con cajas no dice nada.' }),
  cuadroRutas(D.rutas, D.rutasSinCruce),
].join('');

/* ACA LA COLUMNA SE LLAMA GUIAS. `cuadro()` la titula PEDIDOS porque en el
   pendiente eso es lo que cuenta; en este modulo la unidad es la guia del correo
   y las tarjetas de arriba ya dicen GUIAS. Al codearlo va como opcion del
   helper, no como este reemplazo. */
document.getElementById('pend').innerHTML =
    (cab + tarjetas + `<div class="pend-grid">${cuadros}</div>`)
        .replace(/>PEDIDOS</g, '>GUÍAS<');
</script>
</body>
</html>
